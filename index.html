<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Arbeitsblätter für den Deutschunterricht aus Bausteinen setzen und als PDF oder Word speichern.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AB-Werkstatt Deutsch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400;1,7..72,600&family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,800;1,600&family=UnifrakturMaguntia&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: Arbeitspult – links die Bausteine (Editor), rechts das Papier (A4-Vorschau). Papier bleibt in beiden Themes weiß. */
:root{
  --desk:#E3E6ED; --panel:#F5F6F9; --card:#FFFFFF; --field:#FFFFFF;
  --line:#D4D9E3; --line-strong:#B6BDCB;
  --ink:#1A1E29; --muted:#5A6277; --faint:#878FA3;
  --tinte:#2741B5; --tinte-ink:#FFFFFF; --tinte-soft:#E4E9FA;
  --warn:#8F5300; --warn-soft:#FDF0D5;
  --afb1:#2F6B8A; --afb2:#2741B5; --afb3:#7B2C6F;
  --shadow:0 1px 2px rgba(22,30,52,.10), 0 10px 28px rgba(22,30,52,.12);
  --paper:#FFFFFF; --paper-ink:#1C1F27; --paper-muted:#5A606E; --paper-rule:#8E95A3; --paper-hair:#C8CCD5;
  --f-ui:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-text:"Literata", Georgia, "Times New Roman", serif;
  --f-sans:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#11141B; --panel:#181C25; --card:#1F2430; --field:#151922;
  --line:#2C3241; --line-strong:#3E4659;
  --ink:#E6E9F0; --muted:#A3ABBD; --faint:#7D8598;
  --tinte:#93A6FF; --tinte-ink:#0E1430; --tinte-soft:#232B4B;
  --warn:#F0B55C; --warn-soft:#3A2B10;
  --afb1:#8CC3E3; --afb2:#9EB0FF; --afb3:#E39BD4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#11141B; --panel:#181C25; --card:#1F2430; --field:#151922;
  --line:#2C3241; --line-strong:#3E4659;
  --ink:#E6E9F0; --muted:#A3ABBD; --faint:#7D8598;
  --tinte:#93A6FF; --tinte-ink:#0E1430; --tinte-soft:#232B4B;
  --warn:#F0B55C; --warn-soft:#3A2B10;
  --afb1:#8CC3E3; --afb2:#9EB0FF; --afb3:#E39BD4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tinte);outline-offset:2px}

/* ---------- App-Gerüst ---------- */
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:10px 4px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-text);font-weight:700;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.status[data-s="supabase"] i,.status[data-s="claude"] i,.status[data-s="local"] i{background:#2E8A5C}
.status[data-s="saving"] i{background:var(--tinte)}
.status[data-s="error"] i,.status[data-s="toolarge"] i,.status[data-s="offline"] i,.status[data-s="quota"] i{background:#C2410C}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--tinte)}
.btn.primary{background:var(--tinte);color:var(--tinte-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.tabs{display:none;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.l-short{display:none}
.f textarea,.task-ed textarea{field-sizing:content;max-height:60vh}
.tabs button{border:0;background:transparent;padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--tinte);color:var(--tinte-ink)}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,450px) minmax(0,1fr);gap:0}
.pane{min-height:0;min-width:0;overflow:auto}
#editor{background:var(--panel);border-right:1px solid var(--line);padding:14px 14px 40px;display:flex;flex-direction:column;gap:10px;margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding-left:max(16px, env(safe-area-inset-left, 0px))}
#preview{display:flex;flex-direction:column;min-width:0}
.pv-bar{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:10px 16px 0;color:var(--muted);font-size:12.5px}
.pv-hint{font-size:12px;color:var(--faint);padding:4px 16px 0}
.pv-bar .sp{margin-right:auto}
#preview-scroll{flex:1;overflow:auto;padding:14px 16px 48px}
#pages{display:flex;flex-direction:column;align-items:center;gap:22px}
.slot{position:relative;flex:0 0 auto}
.slot>.pout{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:var(--shadow)}
.pg-warn{position:absolute;left:8px;bottom:8px;background:#C2410C;color:#fff;font:700 11px/1.3 var(--f-ui);padding:4px 8px;border-radius:6px;z-index:2}

/* ---------- Editor-Karten ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0}
.card.sel{border-color:var(--tinte);box-shadow:0 0 0 2px var(--tinte-soft)}
.card-h{display:flex;align-items:center;gap:8px;padding:9px 8px 9px 12px;cursor:pointer;user-select:none;min-width:0}
.card-h .kind{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);flex:0 0 auto}
.card-h .sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.card-h .sum.dim{color:var(--faint);font-weight:400}
.ib{width:30px;height:30px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:7px;color:var(--muted);cursor:pointer;flex:0 0 auto}
.ib:hover{background:var(--tinte-soft);color:var(--ink)}
.ib svg{width:16px;height:16px}
.ib[disabled]{opacity:.3;cursor:default;background:transparent}
.card-b{padding:2px 12px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.card.closed .card-b{display:none}
.card.closed .card-h{border-radius:10px}
.memo-flag{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:7px;padding:6px 9px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span,.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.f small{font-size:11.5px;color:var(--faint)}
.f input[type=text],.f input[type=number],.f textarea,.f select,.inp{width:100%;border:1px solid var(--line-strong);background:var(--field);border-radius:7px;padding:7px 9px;font-size:14px;min-width:0}
.f textarea{resize:vertical;line-height:1.45}
.f textarea.serif{font-family:var(--f-text);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.f{flex:1 1 120px}
.row>.f.narrow{flex:0 0 80px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--tinte);margin:0}
.chks{display:flex;flex-wrap:wrap;gap:8px 18px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:4px 10px 4px 5px;background:var(--field);cursor:pointer;font-size:12.5px;font-weight:700}
.sw i{width:16px;height:16px;border-radius:50%;display:block}
.sw[aria-pressed="true"]{border-color:var(--tinte);box-shadow:0 0 0 2px var(--tinte-soft)}
.task-ed{border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:7px;background:var(--panel)}
.task-ed-h{display:flex;align-items:center;gap:6px}
.task-ed-h .no{width:24px;height:24px;border-radius:6px;background:var(--tinte);color:var(--tinte-ink);font-weight:700;font-size:12.5px;display:grid;place-items:center;flex:0 0 auto}
.task-ed-h select{flex:1;min-width:0;border:1px solid var(--line-strong);background:var(--field);border-radius:7px;padding:4px 6px;font-size:12.5px}
.task-ed textarea{width:100%;border:1px solid var(--line-strong);background:var(--field);border-radius:7px;padding:7px 9px;resize:vertical;min-height:58px}
.task-ed .tag{width:100%;border:1px solid var(--line-strong);background:var(--field);border-radius:7px;padding:5px 9px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.5;white-space:nowrap}
.chip.a1{color:var(--afb1)}.chip.a2{color:var(--afb2)}.chip.a3{color:var(--afb3)}
.chip.extra{border-style:dashed}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.prog{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.prog b{color:var(--ink)}
.link{border:0;background:none;color:var(--tinte);font-weight:700;font-size:13px;cursor:pointer;padding:2px 0;text-align:left}
.link.danger{color:#C2410C}
.tbl-ed{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl-ed table{border-collapse:collapse;min-width:100%}
.tbl-ed td{border:1px solid var(--line);padding:0;min-width:110px}
.tbl-ed tr:first-child td{background:var(--tinte-soft)}
.tbl-ed input{width:100%;border:0;background:transparent;padding:6px 8px;font-size:13px}
.tbl-ed tr:first-child input{font-weight:700}
.thumb{max-width:100%;max-height:160px;border-radius:6px;border:1px solid var(--line);align-self:flex-start;background:#fff}
.hint{font-size:12px;color:var(--faint)}
.adder{border:1px dashed var(--line-strong);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.adder .lbl{margin:0}
.adder-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.add-b{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left;min-width:0}
.add-b:hover{border-color:var(--tinte)}
.add-b b{font-size:13.5px}
.add-b span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---------- Worterklärungen ---------- */
.gl-list{display:flex;flex-direction:column;gap:6px}
.gl-row{display:grid;grid-template-columns:22px minmax(0,auto) minmax(0,1fr) 30px;align-items:center;gap:8px}
.gl-no{width:22px;height:22px;border-radius:6px;background:var(--tinte-soft);color:var(--tinte);font-weight:700;font-size:12px;display:grid;place-items:center}
.gl-w{border:0;background:none;padding:0;font-family:var(--f-text);font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.gl-w:hover{color:var(--tinte);text-decoration:underline}
.gl-row input{width:100%;min-width:0;border:1px solid var(--line-strong);background:var(--field);border-radius:7px;padding:6px 8px;font-size:13.5px}
.gl-row.miss .gl-no{background:var(--warn-soft);color:var(--warn)}
.gl-miss,.gl-warn{font-size:12px;color:var(--warn)}
.gl-add{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.gl-add .btn{padding:5px 10px;font-size:13px}
.gl-add small{font-size:11.5px;color:var(--faint)}
.gl-scrim{position:fixed;inset:0;z-index:54;background:rgba(10,14,24,.38);display:none}
.gpop{position:fixed;z-index:55;left:16px;top:16px;width:min(340px,calc(100% - 32px));background:var(--card);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.gpop-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gpop-h span{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.gpop form{display:flex;flex-direction:column;gap:10px}
.gl-term{font-family:var(--f-text);font-size:19px;font-weight:600;line-height:1.25;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;overflow-wrap:anywhere}
.gl-term span{font-family:var(--f-ui);font-size:12px;font-weight:400;color:var(--muted)}
.gpop .err{color:#C2410C;font-size:13px;font-weight:700}
.gpop .err:empty{display:none}
.gpop-a{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gpop-a small{font-size:11.5px;color:var(--faint)}
@media (max-width:599px){
  .gl-scrim{display:block}
  .gpop-a small{display:none}
  .gpop{left:0!important;right:0;top:auto!important;bottom:0;width:100%;border-radius:16px 16px 0 0;border-width:1px 0 0;
    padding:14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
}

/* ---------- Formatierung (Unterbereich in der Materialkarte) ---------- */
.sub{border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.sub-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;cursor:pointer;text-align:left;min-width:0;border-radius:9px}
.sub-h:hover .sub-t{color:var(--tinte)}
.sub-t{font-size:12.5px;font-weight:700;color:var(--ink);flex:0 0 auto}
.sub-s{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-h svg{width:14px;height:14px;flex:0 0 auto;color:var(--muted);transition:transform .15s}
.sub.open .sub-h svg{transform:rotate(180deg)}
.sub-b{padding:10px 10px 12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.seg{display:inline-flex;align-self:flex-start;max-width:100%;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--field)}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--tinte);color:var(--tinte-ink)}

/* ---------- Designs: Auswahl im Kopf ---------- */
.dz-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dz{display:flex;flex-direction:column;align-items:stretch;gap:5px;border:1px solid var(--line-strong);background:var(--field);border-radius:9px;padding:5px 5px 6px;cursor:pointer;text-align:left;min-width:0;color:var(--ink)}
.dz:hover{border-color:var(--tinte)}
.dz[aria-pressed="true"]{border-color:var(--tinte);box-shadow:0 0 0 2px var(--tinte-soft)}
.dz b{font-size:12.5px;padding-left:2px}
.dz-p{position:relative;display:flex;flex-direction:column;gap:4px;height:54px;padding:7px 7px 0 8px;border-radius:5px;background:#FFFFFF;border:1px solid #E1E3E8;overflow:hidden;color:#1C1F27}
.dz-l{display:block;flex:0 0 3px;border-radius:2px;background:#D5D8DF;width:100%}
.dz-l.s{width:62%}
.dzk-bar{display:block;flex:0 0 2px;background:#1F4FA0;margin-bottom:1px}
.dzk-t{font-family:var(--f-text);font-weight:600;font-size:12px;line-height:1}
.dz-akte{background:#F5EEDD;border-color:#E2D6BB}
.dz-akte .dz-l{background:#CFC4AA}
.dza-tab{align-self:flex-start;background:#2B2925;color:#F5EEDD;font-family:"Special Elite","Courier New",monospace;font-size:9.5px;letter-spacing:.15em;padding:1px 5px 0;line-height:1.3}
.dza-st{position:absolute;right:3px;top:16px;transform:rotate(-9deg);border:2px double #B3261E;color:#B3261E;font-family:"Special Elite","Courier New",monospace;font-size:8px;letter-spacing:.06em;padding:0 3px;border-radius:2px;line-height:1.3}
.dzz-r{display:block;flex:0 0 4px;border-top:2px solid #161616;border-bottom:1px solid #161616}
.dzz-r.b{border-top-width:1px;border-bottom-width:2px}
.dzz-m{font-family:"UnifrakturMaguntia","Old English Text MT",serif;font-size:14px;line-height:1;text-align:center}
.dz-tagebuch::before{content:"";position:absolute;left:5px;top:0;bottom:0;border-left:1.5px solid #E7A9A9}
.dzt-t{font-family:"Caveat","Segoe Print",cursive;font-weight:700;font-size:17px;line-height:.9;color:#1F4FA0;padding-left:3px;white-space:nowrap}
.dz-tagebuch .dz-l{margin-left:3px;width:calc(100% - 3px)}
.dz-tagebuch .dz-l.s{width:58%}
@media (max-width:420px){.dz-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- Sozialformen im Editor ---------- */
.soz{display:flex;flex-wrap:wrap;gap:6px}
.soz button{--soz-bg:var(--field);display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);background:var(--field);border-radius:7px;padding:3px 8px 3px 5px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.soz button svg{width:22px;height:16.5px;flex:0 0 auto}
.soz button:hover{color:var(--ink);border-color:var(--tinte)}
.soz button[aria-pressed="true"]{--soz-bg:var(--tinte);background:var(--tinte);border-color:var(--tinte);color:var(--tinte-ink)}

/* ---------- Ausgabe-Leiste und Vorschau-Optionen ---------- */
.tabrow{display:flex;align-items:flex-end;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.outsw{margin-bottom:6px}
.outsw button{display:inline-flex;align-items:center;gap:6px}
.outsw button span{font-size:10.5px;line-height:1.5;padding:0 6px;border-radius:999px;background:var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.outsw button[aria-pressed="true"] span{background:rgba(255,255,255,.22);color:inherit}
.seg.sm button{padding:4px 10px;font-size:12px}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pv-opts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-right:auto;min-width:0}
.pv-empty{max-width:440px;margin:40px auto;padding:22px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5;border:1px dashed var(--line-strong);border-radius:12px;background:var(--panel)}

/* ---------- Menü an der Karte ---------- */
.mn{position:fixed;z-index:56;min-width:220px;max-width:calc(100% - 16px);background:var(--card);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.mn button{display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:7px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.mn button:hover,.mn button:focus-visible{background:var(--tinte-soft)}
.mn button.danger{color:#C2410C}
.mn button[aria-checked="true"]{font-weight:700}
.mn button[aria-checked="true"]::after{content:"";margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--tinte)}
.mn hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.mn small{padding:4px 10px 2px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gpill{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--tinte-soft);color:var(--tinte);flex:0 0 auto;white-space:nowrap}

/* ---------- Aufgaben-Extras ---------- */
.tx-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tx{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--line-strong);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx:hover{color:var(--ink);border-color:var(--tinte)}
.tx.filled{border-style:solid;color:var(--ink)}
.tx.filled::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tinte);flex:0 0 auto}
.tx.on{border-color:var(--tinte);background:var(--tinte-soft);color:var(--ink)}
.tx-pts{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.tx-pts input{width:96px;border:1px solid var(--line-strong);background:var(--field);border-radius:7px;padding:3px 7px;font-size:12.5px}
.tx-f{gap:6px}
.tx-f textarea{min-height:58px}

/* ---------- Hinweise ---------- */
.gnote{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:7px 10px}
.gn-hit{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:baseline}
.gnote .link{font-size:12px;padding:0}
.zl-hint{font-size:11.5px;color:var(--muted)}
.zl-a{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Sammlung ---------- */
.snips{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
.snip{display:flex;align-items:center;gap:4px}
.snip-add{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left}
.snip-add:hover{border-color:var(--tinte)}
.snip-add b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snip-add span{font-size:11.5px;color:var(--muted)}

/* ---------- Tafelkarten-Editor ---------- */
.kk-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.kk-sw{display:flex;flex-wrap:wrap;gap:8px}
.kk-sw button{width:24px;height:24px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line-strong);cursor:pointer}
.kk-sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.kk-set{display:flex;flex-direction:column;gap:10px}
.f.kk-pt{max-width:170px}
.km-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.km{display:flex;flex-direction:column;align-items:stretch;gap:5px;border:1px solid var(--line-strong);background:var(--field);border-radius:9px;padding:5px 5px 7px;cursor:pointer;text-align:center;min-width:0;color:var(--ink)}
.km:hover{border-color:var(--tinte)}
.km[aria-pressed="true"]{border-color:var(--tinte);box-shadow:0 0 0 2px var(--tinte-soft)}
.km[aria-pressed="true"] b{color:var(--tinte)}
.km svg{display:block;width:100%;height:auto;aspect-ratio:80/50;border-radius:5px;background:#ECEEF3}
.km b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.km-d{font-size:12px;color:var(--muted);line-height:1.45}
.km-i{width:16px;height:12px;flex:0 0 auto;vertical-align:-2px;margin-right:5px}
.seg button .km-i{margin-right:4px}
.kk-fine .seg{flex-wrap:wrap}
.kk-fine .f small{font-size:11.5px;color:var(--faint)}
@media (max-width:420px){.km-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- Bibliothek ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);
  padding:calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) 16px}
.drawer-h{display:flex;align-items:center;gap:8px}
.drawer-h h2{font-family:var(--f-text);font-size:20px;margin:0}
.drawer-h .dh{margin-right:auto;display:flex;align-items:baseline;gap:10px;min-width:0}
.drawer-h .dh span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.drawer p.note{font-size:12.5px;color:var(--muted);margin:6px 0 12px}
.drawer .row{margin-bottom:10px}
.lib-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.lib-item{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.lib-item.cur{border-color:var(--tinte)}
.lib-item .t{font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.lib-item .t em{font-style:normal;font-size:11px;font-weight:700;color:var(--tinte);border:1px solid var(--tinte);border-radius:5px;padding:0 5px;flex:0 0 auto}
.lib-item .m{font-size:12px;color:var(--muted)}
.lib-item .a{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);font-size:13px;padding:18px 4px}

/* ---------- Toast / Overlay ---------- */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--desk);padding:9px 14px;border-radius:9px;font-weight:700;font-size:13.5px;z-index:60;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:inherit;text-decoration:underline;font-weight:700;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(10,14,24,.55);z-index:80;display:grid;place-items:center}
.overlay div{background:var(--card);color:var(--ink);border-radius:12px;padding:18px 22px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- Reiter (eine Ablage je Klasse) ---------- */
.reiter{display:flex;align-items:flex-end;gap:2px;padding-top:6px;margin-bottom:-1px;overflow-x:auto;scrollbar-width:none;min-width:0}
.reiter::-webkit-scrollbar{display:none}
.rt{display:flex;align-items:center;gap:8px;flex:0 0 auto;border:1px solid transparent;border-bottom:0;background:transparent;margin-bottom:0;padding:8px 16px 9px;border-radius:10px 10px 0 0;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.rt i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.rt span{font-size:11px;line-height:1.55;padding:0 6px;border-radius:999px;background:var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.rt:hover{color:var(--ink)}
.rt[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink)}
.rt[aria-selected="true"] span{background:var(--tinte-soft);color:var(--tinte)}

/* ---------- Konto, Hinweise, Dialog ---------- */
.acct{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:10px 0 12px}
.acct b{color:var(--ink)}
.notice{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.drawer-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;gap:6px 18px;flex-wrap:wrap}
.dlg-scrim{z-index:50}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:51;width:min(420px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-family:var(--f-text);font-size:21px;margin:0}
.dlg>p{margin:0;color:var(--muted);font-size:13.5px}
.dlg form{display:flex;flex-direction:column;gap:12px}
.dlg .err{color:#C2410C;font-size:13px;font-weight:700}
.dlg .err:empty{display:none}
.dlg .ok{background:var(--tinte-soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
.dlg .links{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.btn[disabled]{opacity:.55;cursor:default}

/* ---------- Mobil ---------- */
@media (max-width: 899px){
  .bar{gap:8px 10px}
  .brand{order:1}
  .actions{order:2;gap:6px}
  .tabs{display:inline-flex;order:3}
  .status{order:4;flex:1 1 0;font-size:12px}
  .l-long{display:none}.l-short{display:inline}
  .btn{padding:6px 10px;font-size:13px}
  .rt{padding:7px 12px 8px;font-size:13.5px}
  .main{grid-template-columns:minmax(0,1fr)}
  #editor{border-right:0;margin-left:0;padding-left:0;padding-right:0;background:transparent}
  #preview-scroll{padding-left:0;padding-right:0}
  .pv-bar,.pv-hint{padding-left:0;padding-right:0}
  .brand span{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* =================== DAS BLATT (Papier, mm-genau) =================== */
.page{width:210mm;height:297mm;padding:14mm 18mm 0 18mm;background:var(--paper);color:var(--paper-ink);font-family:var(--f-ui);font-size:10.5pt;line-height:1.42;overflow:hidden;position:relative;-webkit-font-smoothing:antialiased}
.page *{box-sizing:border-box}
.pg-body{display:flex;flex-direction:column;gap:5mm}
.pg-foot{position:absolute;left:18mm;right:18mm;bottom:8mm;display:flex;justify-content:space-between;gap:6mm;font-size:7.5pt;color:var(--paper-muted);border-top:.2mm solid var(--paper-hair);padding-top:1.4mm}
.blk{position:relative}
#preview .page [data-bid]{cursor:pointer}
#preview .page [data-bid]:hover{outline:.4mm dashed var(--paper-hair);outline-offset:1.2mm}
#preview .page .is-sel{outline:.5mm solid var(--acc);outline-offset:1.2mm}

/* Kopf */
.hd-top{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;border-bottom:.6mm solid var(--acc);padding-bottom:1.6mm}
.hd-course{flex:0 0 auto;font-size:7.8pt;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--paper-muted);white-space:nowrap}
.hd-fields{flex:1 1 auto;min-width:0;display:flex;justify-content:flex-end;gap:5mm;font-size:8.5pt;color:var(--paper-muted);white-space:nowrap}
.hd-fields span{display:flex;align-items:flex-end;gap:1.5mm;flex:1 1 0;min-width:0;max-width:62mm}
.hd-fields span.dt{max-width:36mm}
.hd-fields i{flex:1 1 auto;min-width:10mm;border-bottom:.2mm solid var(--paper-rule);height:3.4mm}
.hd-main{display:flex;gap:4mm;align-items:center;margin-top:3.6mm}
.hd-nr{flex:0 0 auto;min-width:13mm;height:13mm;padding:0 1.6mm;border-radius:1.2mm;background:var(--acc);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.hd-nr small{font-size:6pt;font-weight:700;letter-spacing:.12em;margin-bottom:.8mm}
.hd-nr b{font-family:var(--f-text);font-weight:700;font-size:15pt}
.hd-titles{min-width:0}
.hd-titles h1{font-family:var(--f-disp,var(--f-text));font-weight:600;font-size:16.5pt;line-height:1.18;margin:0;letter-spacing:-.005em}
.hd-titles p{margin:1mm 0 0;font-size:9pt;color:var(--paper-muted)}

/* Überschrift, Absatz */
.blk-h h2{font-family:var(--f-disp,var(--f-text));font-weight:600;font-size:12.5pt;line-height:1.25;color:var(--acc);margin:0}
.blk-text p{margin:0}
.blk-text p+p{margin-top:2mm}

/* Material */
.mat-head{display:flex;gap:2.5mm;align-items:baseline;padding-bottom:2mm}
.mat-no{flex:0 0 auto;font-size:8.5pt;font-weight:700;color:var(--paper);background:var(--acc);padding:.5mm 1.6mm;border-radius:.8mm;line-height:1.3}
.mat-title{font-weight:700;font-size:10pt;line-height:1.35}
.mat-cont{font-size:7.5pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);padding-bottom:1.5mm}
.mat-body{font-family:var(--mff,var(--f-text));font-size:var(--mfs,10.5pt);line-height:var(--mlh,1.52)}
.mat-body p{margin:0 0 0 10mm}
.mat-body p.ind{text-indent:4mm}
.mat-body sup,.task-body sup,.blk-text sup,.info-text sup{font-size:.62em;line-height:0;vertical-align:.55em}
.ln{display:flex;align-items:baseline}
.ln-no{flex:0 0 7mm;margin-right:3mm;text-align:right;font-family:var(--f-ui);font-size:7pt;color:var(--paper-muted);font-variant-numeric:tabular-nums}
.ln-t{flex:1;min-width:0;white-space:nowrap;text-align:justify;text-align-last:justify}
.ln.pl .ln-t{text-align-last:auto}
.ln.pf .ln-t{padding-left:4mm}
.blk-mat.al-left .ln-t{text-align:left;text-align-last:auto}
.blk-mat.noind .ln.pf .ln-t{padding-left:0}
.blk-mat.noind .mat-body p.ind{text-indent:0}
.blk-mat.rand .mat-body{width:calc(100% - 28mm);padding-right:4mm;border-right:.25mm solid var(--paper-hair)}
#preview .page .mat-body .w{border-radius:.6mm;cursor:pointer}
#preview .page .mat-body .w:hover{background:var(--acc-tint)}
#preview .page .mat-body .w.glw{text-decoration-line:underline;text-decoration-style:dotted;text-decoration-color:var(--acc);text-decoration-thickness:.35mm;text-underline-offset:.9mm}
.mat-tail{padding:2mm 0 0 10mm}
.notes{border-top:.2mm solid var(--paper-hair);padding-top:1mm;font-size:8pt;line-height:1.4;max-width:120mm}
.notes div{padding-left:3mm;text-indent:-3mm}
.src{font-size:7.5pt;color:var(--paper-muted);margin-top:1.2mm;line-height:1.35}

/* Aufgaben */
.tasks-title{font-size:8pt;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);padding-bottom:1.2mm}
.task{display:grid;grid-template-columns:6mm minmax(0,1fr) auto;column-gap:3mm;align-items:start;padding:.9mm 0}
.task-no{width:5.6mm;height:5.6mm;border-radius:.8mm;background:var(--acc);color:var(--paper);font-weight:700;font-size:9pt;display:flex;align-items:center;justify-content:center;margin-top:.15mm;line-height:1}
.task-body{font-size:10.5pt;line-height:1.45}
.task-tag{display:inline-block;border:.2mm solid var(--acc);color:var(--acc);font-weight:700;font-size:7pt;letter-spacing:.06em;text-transform:uppercase;padding:0 1.2mm;border-radius:.8mm;margin-right:1.6mm;line-height:1.6;vertical-align:.25mm}
.task-afb{font-size:7.5pt;color:var(--paper-muted);white-space:nowrap;padding-top:.9mm}

/* Infokasten */
.blk-info{background:var(--acc-tint);border-left:1.2mm solid var(--acc);border-radius:0 1.2mm 1.2mm 0;padding:3mm 4mm 3.2mm}
.info-kind{font-size:7.2pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.info-title{font-weight:700;font-size:10.5pt;margin-top:.6mm}
.info-text{font-size:10pt;margin-top:1mm}
.info-text p{margin:0}.info-text p+p{margin-top:1.6mm}

/* Zitat */
.blk-quote{padding:1mm 6mm 1mm 12mm;position:relative}
.q-mark{position:absolute;left:1mm;top:-3mm;font-family:var(--f-text);font-size:34pt;line-height:1;color:var(--acc)}
.q-text{font-family:var(--f-text);font-style:italic;font-size:12.5pt;line-height:1.42}
.q-author{text-align:right;font-size:8.5pt;color:var(--paper-muted);margin-top:1.5mm}

/* Tabelle */
.tb-title{font-weight:700;font-size:10pt;padding-bottom:1.6mm}
.tb{width:100%;border-collapse:collapse;font-size:9.5pt;line-height:1.35;table-layout:fixed}
.tb th{background:var(--acc-tint);text-align:left;font-weight:700;padding:1.6mm 2mm;border:.25mm solid var(--paper-rule);vertical-align:bottom}
.tb td{border:.25mm solid var(--paper-rule);padding:1.6mm 2mm;vertical-align:top}
.tb.h-normal td{height:8mm}.tb.h-hoch td{height:16mm}.tb.h-sehrhoch td{height:28mm}
.tb.fb td:first-child{font-weight:700}

/* Schreibfläche */
.wl{height:9mm;border-bottom:.2mm solid var(--paper-rule)}
.grid-area{border:.2mm solid var(--paper-hair);background-size:5mm 5mm;background-repeat:repeat}

/* Bild */
.blk-img{text-align:center}
.blk-img img{display:inline-block;max-width:100%;height:auto}
.img-cap{font-size:8.5pt;margin-top:1.2mm}
.img-src{font-size:7.5pt;color:var(--paper-muted);margin-top:.6mm}
.img-empty{border:.3mm dashed var(--paper-hair);color:var(--paper-muted);font-size:9pt;padding:10mm;text-align:center}

/* Sozialform-Piktogramm in der Aufgabe */
.blk-tasks.has-soz .task{grid-template-columns:6mm 8mm minmax(0,1fr) auto}
.task-soz img{display:block;width:8mm;height:6mm;margin-top:-.2mm}

/* ===== Design: Akte ===== */
.page.d-akte{--f-ui:"Courier Prime","Courier New",Courier,monospace;--f-text:"Courier Prime","Courier New",Courier,monospace;--f-disp:"Special Elite","Courier New",Courier,monospace;--paper-rule:#6F6A60;--paper-hair:#B9B2A2;--paper-muted:#5E5A52;font-size:10pt}
.page.d-akte.tone{background:#F5EEDD}
.page.d-akte::before,.page.d-akte::after{content:"";position:absolute;left:6.5mm;width:5.5mm;height:5.5mm;border-radius:50%;border:.3mm solid rgba(60,50,30,.28);background:rgba(60,50,30,.05)}
.page.d-akte::before{top:105.75mm}
.page.d-akte::after{top:185.75mm}
.ak{padding-top:1mm}
.ak-box{border:.4mm solid var(--acc)}
.ak-band{display:flex;align-items:stretch;gap:3mm;border-bottom:.4mm solid var(--acc);min-height:7mm;padding-right:36mm}
.ak-tab{background:var(--acc);color:#F5EEDD;font-family:var(--f-disp);font-size:11pt;letter-spacing:.25em;text-transform:uppercase;padding:1mm 4mm 0;display:flex;align-items:center}
.ak-org{font-size:7.3pt;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;color:var(--paper-muted);min-width:0}
.ak-row{display:flex}
.ak-row+.ak-row{border-top:.25mm solid var(--acc)}
.ak-f{padding:1.6mm 3mm 2mm;display:flex;flex-direction:column;gap:.8mm;min-width:0}
.ak-f+.ak-f{border-left:.25mm solid var(--acc)}
.ak-f>span{font-size:6.8pt;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-muted)}
.ak-az{flex:0 0 36mm}
.ak-az b{font-family:var(--f-disp);font-size:14pt;font-weight:400}
.ak-betr{flex:1}
.ak-betr b{font-family:var(--f-disp);font-size:15pt;font-weight:400;line-height:1.2}
.ak-betr i{font-style:normal;font-size:8.5pt;color:var(--paper-muted)}
.ak-sig .ak-line{flex:1;flex-direction:row;align-items:flex-end;gap:2mm;padding-top:3mm}
.ak-sig .ak-dt{flex:0 0 58mm}
.ak-line>span{white-space:nowrap}
.ak-line u{flex:1;border-bottom:.25mm dotted var(--acc);height:4mm;text-decoration:none}
.ak-stamp{position:absolute;right:3mm;top:-4mm;transform:rotate(-8deg);border:.8mm double #B3261E;color:#B3261E;font-family:var(--f-disp);font-size:13pt;letter-spacing:.16em;padding:1.2mm 3mm .6mm;text-transform:uppercase;opacity:.86;border-radius:1mm;white-space:nowrap;max-width:70mm;overflow:hidden}
.d-akte .mat-no,.d-akte .task-no{background:transparent;color:var(--acc);border:.3mm solid var(--acc);border-radius:0}
.d-akte .mat-no{font-family:var(--f-disp);font-weight:400;letter-spacing:.04em}
.d-akte .tasks-title,.d-akte .info-kind,.d-akte .mat-cont{font-family:var(--f-disp);font-weight:400;letter-spacing:.14em}
.d-akte .blk-h h2{font-family:var(--f-disp);font-weight:400;text-decoration:underline;text-decoration-thickness:.25mm;text-underline-offset:1mm}
.d-akte .blk-info{background:transparent;border:.3mm dashed var(--acc);border-radius:0}
.d-akte .tb th{background:transparent;border-bottom:.7mm double var(--acc)}
.d-akte .q-mark{font-family:var(--f-disp)}

/* ===== Design: Zeitung ===== */
.page.d-zeitung{--f-disp:"Playfair Display",Georgia,"Times New Roman",serif;--paper-rule:#555555;--paper-hair:#BDBDBD}
.zt-top{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;font-size:7.5pt;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-muted);padding-bottom:1.4mm}
.zt-top .hd-fields{text-transform:none;letter-spacing:0}
.zt-rule{height:1.7mm;border-top:1mm solid var(--acc);border-bottom:.3mm solid var(--acc)}
.zt-rule.b{border-top-width:.3mm;border-bottom-width:1mm}
.zt-mast{font-family:"UnifrakturMaguntia","Old English Text MT",serif;font-size:31pt;line-height:1.08;text-align:center;padding:1.6mm 0 .6mm;color:var(--acc)}
.zt-line{display:flex;justify-content:center;font-size:7.2pt;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-muted);padding-top:1.2mm}
.zt-title{font-family:var(--f-disp);font-weight:800;font-size:22pt;line-height:1.1;margin:4mm 0 0;letter-spacing:-.01em}
.zt-deck{font-family:var(--f-disp);font-style:italic;font-weight:600;font-size:10.5pt;margin:1.4mm 0 0;color:var(--paper-muted)}
.d-zeitung .blk-h h2{font-family:var(--f-disp);font-weight:800;font-size:13.5pt;border-bottom:.3mm solid var(--acc);padding-bottom:1mm}
.d-zeitung .mat-head{border-top:.3mm solid var(--acc);padding-top:1.8mm}
.d-zeitung .mat-title{font-family:var(--f-disp);font-weight:700;font-size:11pt}
.d-zeitung .blk-info{background:transparent;border:0;border-top:1mm solid var(--acc);border-bottom:.3mm solid var(--acc);border-radius:0;padding:2.4mm 0 2.6mm}
.d-zeitung .info-title{font-family:var(--f-disp);font-size:11.5pt}
.d-zeitung .tasks-title{font-family:var(--f-disp);font-size:10.5pt;letter-spacing:.06em;font-weight:800}
.d-zeitung .task-no,.d-zeitung .mat-no{border-radius:0}
.d-zeitung .tb th{background:transparent;border-bottom:.8mm solid var(--acc)}

/* ===== Design: Tagebuch ===== */
.page.d-tagebuch{--f-disp:"Caveat","Segoe Print","Comic Sans MS",cursive}
.page.d-tagebuch::before{content:"";position:absolute;top:0;bottom:0;left:12.5mm;border-left:.35mm solid #E7A9A9}
.tg-top{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;font-size:8pt;color:var(--paper-muted)}
.tg-top .hd-fields span{font-family:var(--f-disp);font-size:12.5pt;font-weight:700;color:var(--acc)}
.tg-main{position:relative;margin-top:3mm;padding:1mm 0 2.6mm;border-bottom:.35mm solid var(--acc)}
.tg-main.has-nr{padding-right:26mm}
.tg-main h1{font-family:var(--f-disp);font-weight:700;font-size:28pt;line-height:1;margin:0;color:var(--acc)}
.tg-main p{margin:1.2mm 0 0;font-size:9pt;color:var(--paper-muted)}
.tg-nr{position:absolute;right:1mm;top:0;font-family:var(--f-disp);font-weight:700;font-size:16pt;line-height:1.2;color:var(--acc);transform:rotate(-5deg);border:.35mm solid var(--acc);border-radius:50%;padding:.6mm 3.2mm}
.d-tagebuch .task-no{background:transparent;color:var(--acc);border:.35mm solid var(--acc);border-radius:50%;font-family:var(--f-disp);font-size:12.5pt}
.d-tagebuch .tasks-title{font-family:var(--f-disp);font-size:16pt;letter-spacing:0;text-transform:none;font-weight:700;padding-bottom:.4mm}
.d-tagebuch .blk-h h2{font-family:var(--f-disp);font-size:19pt;font-weight:700}
.d-tagebuch .blk-info{background:#FFF6C4;border-left:0;border-radius:.6mm;box-shadow:.6mm .8mm 0 rgba(0,0,0,.07)}
.d-tagebuch .info-kind{font-family:var(--f-disp);font-size:14pt;letter-spacing:0;text-transform:none;font-weight:700}
.d-tagebuch .mat-no{border-radius:1.4mm;font-family:var(--f-disp);font-size:12pt;padding:0 2mm}
.d-tagebuch .q-mark{font-family:var(--f-disp)}

/* Lehrerfassung, Gruppen, Klausur */
.task-eh{grid-column:2 / -1;margin-top:1.2mm;background:#F1F2F4;border-left:.8mm solid #9AA0AA;border-radius:0 .8mm .8mm 0;padding:1.4mm 2.6mm 1.6mm;font-size:9.5pt;line-height:1.38;color:#2A2D35}
.task-eh>span{display:block;font-family:"Atkinson Hyperlegible","Segoe UI",sans-serif;font-size:6.8pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6A707C}
.task-eh ul{margin:.4mm 0 0;padding-left:4mm}
.task-afb b{color:var(--paper-ink);font-size:8.5pt}
.pg-badge{position:absolute;top:5.5mm;right:18mm;font-family:"Atkinson Hyperlegible","Segoe UI",sans-serif;font-size:7pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#B3261E;border:.3mm solid #B3261E;border-radius:.8mm;padding:.3mm 1.6mm}
.grp-badge{display:flex;align-items:baseline;gap:2.4mm;font-size:9pt;color:var(--paper-muted)}
.grp-badge b{background:var(--acc);color:#FFFFFF;padding:.5mm 2.6mm;border-radius:.8mm;font-size:9.5pt;letter-spacing:.03em}
.blk[data-grp]::after{content:attr(data-grp);position:absolute;right:0;top:-3.4mm;font-family:"Atkinson Hyperlegible","Segoe UI",sans-serif;font-size:6.3pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.blk-cover{display:flex;flex-direction:column;gap:4mm}
.cv-top{display:flex;justify-content:space-between;gap:6mm;font-size:8pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-muted);border-bottom:.6mm solid var(--acc);padding-bottom:1.6mm}
.cv-title{font-family:var(--f-disp,var(--f-text));font-weight:600;font-size:26pt;line-height:1.1;margin-top:16mm}
.cv-sub{font-size:11pt;color:var(--paper-muted);margin-top:-2mm}
.cv-grid{width:100%;border-collapse:collapse;font-size:10.5pt;margin-top:6mm}
.cv-grid th{text-align:left;font-weight:700;width:44mm;padding:3.2mm 0 1.4mm;vertical-align:bottom;border-bottom:.25mm solid var(--paper-hair)}
.cv-grid td{padding:3.2mm 0 1.4mm;border-bottom:.25mm solid var(--paper-rule);vertical-align:bottom}
.cv-h{font-size:8pt;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin-top:5mm}
.cv-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1.4mm;font-size:10pt}
.cv-list li{display:flex;gap:3mm}
.cv-list b{flex:0 0 9mm;color:var(--acc)}
.cv-tasks{border-collapse:collapse;font-size:10pt;width:90mm}
.cv-tasks td{border:.25mm solid var(--paper-rule);padding:1.6mm 3mm}
.cv-tasks tr:first-child td{font-weight:700;background:var(--acc-tint)}
.run-head{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;font-size:8pt;color:var(--paper-muted);border-bottom:.4mm solid var(--acc);padding-bottom:1.4mm}
.run-head span:last-child{display:flex;gap:2mm;align-items:flex-end}
.run-head i{display:inline-block;width:60mm;border-bottom:.2mm solid var(--paper-rule);height:3.4mm}

/* QR-Code */
.blk-qr{display:flex;gap:4.5mm;align-items:center}
.blk-qr img{flex:0 0 auto;image-rendering:pixelated}
.qr-t{display:flex;flex-direction:column;gap:1mm;min-width:0}
.qr-t b{font-size:10.5pt}
.qr-url{font-size:7.8pt;color:var(--paper-muted);word-break:break-all}
.qr-note{font-size:8.5pt}
.qr-empty{flex:0 0 auto;border:.3mm dashed var(--paper-hair);display:grid;place-items:center;color:var(--paper-muted);font-size:8pt;text-align:center;padding:2mm}

/* Zeilenangaben in der Vorschau */
#preview .page .ln-no{cursor:pointer;border-radius:.6mm;padding-block:.5mm}
#preview .page .ln-no:empty::before{content:"\200b"}
#preview .page .ln-no:hover{background:var(--acc-tint);color:var(--acc)}
#preview .page .ln-no:empty:hover::before{content:attr(data-n)}
#preview .page .ln.zsel .ln-t{background:var(--acc-tint)}
#preview .page .ln.zsel .ln-no{color:var(--acc);font-weight:700}
#preview .page .ln.zsel .ln-no:empty::before{content:attr(data-n)}

/* Zwei A5 auf A4 quer */
.page.a5{width:148mm;height:210mm;padding:10mm 11mm 0}
.page.a5 .pg-foot{left:11mm;right:11mm;bottom:6mm}
.page.a5 .pg-badge{right:11mm;top:3.5mm}
.page.a5.d-akte::before{left:3.5mm;top:62.25mm}
.page.a5.d-akte::after{left:3.5mm;top:142.25mm}
.page.a5.d-tagebuch::before{left:7.5mm}
#measure-host .page.a5{height:auto}
.bogen{width:297mm;height:210mm;background:#FFFFFF;display:flex;justify-content:space-between;position:relative}
.bogen>.page{flex:0 0 148mm;box-shadow:none}
.bogen::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:.3mm dashed #8E95A3}
.bogen.buch::after,.bogen.buch::before{content:"";position:absolute;left:50%;height:5mm;border-left:.25mm solid #B8BEC9}
.bogen.buch::after{top:0;bottom:auto}
.bogen.buch::before{bottom:0}
.bogen.buch>.page:first-child .pg-foot{flex-direction:row-reverse}
.bogen.buch>.page+.page.d-akte::before,.bogen.buch>.page+.page.d-akte::after{display:none}
.bogen.buch>.leer{flex:0 0 148mm}

/* Tippkarten */
.tk-page{padding:10mm;font-family:"Atkinson Hyperlegible","Segoe UI",sans-serif}
.tk-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,minmax(0,1fr));height:277mm;padding:.25mm 0 0 .25mm}
.tk-card{border:.25mm dashed #9AA0AA;margin:-.25mm 0 0 -.25mm;padding:6mm 7mm 4mm;display:flex;flex-direction:column;gap:3mm;min-height:0;overflow:hidden}
.tk-h{display:flex;align-items:center;gap:2.4mm;font-size:8.5pt;color:var(--paper-muted)}
.tk-h b{background:var(--acc);color:#FFFFFF;font-size:9pt;padding:.5mm 2.4mm;border-radius:.8mm}
.tk-t{flex:1;min-height:0;font-size:12pt;line-height:1.4;overflow:hidden}
.tk-f{font-size:6.8pt;color:var(--paper-muted)}

/* Tafelkarten */
.kk-page{width:297mm;height:210mm;padding:9mm;background:#FFFFFF}
.kk-frame{width:100%;height:100%;border:2.4mm solid var(--kc);border-radius:7mm;display:flex;align-items:center;justify-content:center;padding:12mm 16mm;overflow:hidden}
.kk-in{width:100%;font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;font-weight:700;color:#1C1F27;line-height:1.16;overflow-wrap:normal;word-break:normal}
.kk-in.term{text-align:center;color:var(--kc)}
.kk-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.42em}
.kk-list li{position:relative;padding-left:.85em}
.kk-list li::before{content:"";position:absolute;left:0;top:.4em;width:.36em;height:.36em;border-radius:50%;background:var(--kc)}
.kk-page.a5{width:210mm;height:148.5mm;padding:6mm}
.kk-page.a5 .kk-frame{border-width:1.8mm;border-radius:5mm;padding:8mm 11mm}
.kk-sheet{width:210mm;height:297mm;background:#FFFFFF;display:flex;flex-direction:column;position:relative}
.kk-sheet>.kk-page{flex:0 0 148.5mm}
.kk-page.strip{width:297mm;height:105mm;padding:5mm}
.kk-page.strip .kk-frame{border-width:1.8mm;border-radius:5mm;padding:6mm 12mm}
.kk-sheet.quer{width:297mm;height:210mm}
.kk-sheet.quer>.kk-page{flex:0 0 105mm}
.kk-tip{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:12px;color:var(--muted);background:var(--tinte-soft);border-radius:7px;padding:6px 9px}
.kk-tip .link{font-size:12px;padding:0}
.kk-sheet::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:.3mm dashed #8E95A3}
.cut{position:absolute;z-index:1;width:6.5mm;height:6.5mm;background:#FFFFFF;box-sizing:content-box}
.kk-sheet>.cut{left:9mm;top:50%;margin-top:-3.25mm;padding:0 1.2mm}
.bogen>.cut{left:50%;top:9mm;margin-left:-3.25mm;padding:1.2mm 0;transform:rotate(90deg)}
#fit-host{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;z-index:-1}

/* Mess- und Druckbühne */
#measure-host{position:fixed;left:0;top:0;width:0;height:0;overflow:visible;visibility:hidden;pointer-events:none;z-index:-1}
#measure-host .page{height:auto;position:absolute;left:0;top:0}
#printroot{display:none}
@media print{
  @page{size:A4;margin:0}
  body{padding:0!important;background:#fff}
  #app,.toast,.overlay,.drawer,.scrim{display:none!important}
  #printroot{display:block}
  #printroot>.pout{break-after:page;box-shadow:none}
  #printroot .page{box-shadow:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><b>AB-Werkstatt</b><span>Deutsch</span></div>
    <div class="tabs" role="group" aria-label="Ansicht">
      <button type="button" id="tab-edit" data-act="tab" data-v="edit" aria-pressed="true">Bearbeiten</button>
      <button type="button" id="tab-prev" data-act="tab" data-v="preview" aria-pressed="false">Vorschau</button>
    </div>
    <div class="status" id="status" data-s="example"><i></i><span>Beispielblatt</span></div>
    <div class="actions">
      <button class="btn" type="button" id="btn-login" data-act="login" hidden>Anmelden</button>
      <button class="btn" type="button" id="btn-lib" data-act="lib-open">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 3.5h4l1.2 1.5h5.8v7.5h-11z"/></svg><span class="l-long">Meine Blätter</span><span class="l-short">Blätter</span></button>
      <button class="btn" type="button" id="btn-docx" data-act="docx">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 1.8h5.5l3 3v9.4H4z"/><path d="M9.5 1.8v3h3"/><path d="M5.8 8l.9 3.6L8 8.6l1.3 3L10.2 8"/></svg>Word</button>
      <button class="btn primary" type="button" id="btn-pdf" data-act="pdf">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6V1.8h8V6"/><rect x="1.8" y="6" width="12.4" height="5.5" rx="1"/><path d="M4 9.5h8v4.7H4z"/></svg><span class="l-long">PDF zum Drucken</span><span class="l-short">PDF</span></button>
      <button class="btn" type="button" id="btn-print" data-act="print" hidden>Drucken</button>
    </div>
  </header>
  <div class="tabrow"><nav class="reiter" id="reiter" role="tablist" aria-label="Klassen"></nav><div class="seg sm outsw" id="outsw" role="group" aria-label="Ausgabe"></div></div>
  <div class="main">
    <section class="pane" id="editor" aria-label="Bausteine"></section>
    <section class="pane" id="preview" aria-label="Vorschau">
      <div class="pv-bar"><span id="pagecount">A4</span><div class="pv-opts" id="pv-opts"></div>
        <button class="btn ghost" type="button" id="btn-zoom" data-act="zoom">100 %</button></div>
      <div class="pv-hint" id="pv-hint">Tipp: Wort im Material anklicken für eine Worterklärung · Zeilennummer anklicken für eine Zeilenangabe</div>
      <div id="preview-scroll"><div id="pages"></div></div>
    </section>
  </div>
</div>
<div id="measure-host"><div class="page" id="measure"><div class="pg-body"></div></div></div>
<div id="fit-host"></div>
<div id="printroot"></div>
<div id="lib-root"></div>
<div id="dlg-root"></div>
<div id="gl-root"></div>
<div id="zl-root"></div>
<div id="menu-root"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<div id="toast-root"></div>

<script>
(() => {
'use strict';

/* ================= Grundlagen ================= */
const MMPX = 96 / 25.4;
let AVAIL = 264 * MMPX;          // nutzbare Höhe je Seite (mm → px)
const GAP = 5 * MMPX;              // Abstand zwischen Bausteinen
const LIBS = {
  h2c: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  zip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  supa: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4'
};
const FONT_SPECS = ['400 11pt "Atkinson Hyperlegible"','700 11pt "Atkinson Hyperlegible"','italic 400 11pt "Atkinson Hyperlegible"',
  '400 11pt Literata','600 11pt Literata','700 11pt Literata','italic 400 11pt Literata'];
const ACCENTS = {
  tinte:   { name:'Tinte',   c:'#1F4FA0', t:'#E9EEF8' },
  petrol:  { name:'Petrol',  c:'#0D6767', t:'#E3F0EF' },
  wein:    { name:'Weinrot', c:'#8A2A3E', t:'#F5E9EC' },
  graphit: { name:'Graphit', c:'#383C44', t:'#ECEDF0' }
};
/* Reiter: eine Ablage je Klasse. Neue Blätter übernehmen Kurs, Farbe und Anrede der Klasse. */
const KLASSEN = [
  { id: 'gk',   label: 'Grundkurs',   course: 'Grundkurs Deutsch',   accent: 'tinte',  anrede: 'sie' },
  { id: 'k10',  label: 'Klasse 10',   course: 'Deutsch Klasse 10',   accent: 'petrol', anrede: 'du' },
  { id: 'k910', label: 'Klasse 9/10', course: 'Deutsch Klasse 9/10', accent: 'wein',   anrede: 'du' }
];
const KL = id => KLASSEN.find(k => k.id === id) || KLASSEN[0];
/* Online-Ablage über Supabase. Leer = ausgeschaltet: Blätter bleiben im Browser.
   Zum Einschalten Project URL und Publishable key eintragen (Anleitung in README.md). */
const SUPABASE = { url: '', key: '' };
const INFO_KINDS = ['Info','Merke','Tipp','Hinweis','Methode','Definition'];
const TYPES = {
  material: { label:'Material',      desc:'Text mit Zeilennummern' },
  tasks:    { label:'Aufgaben',      desc:'mit Operator-Check' },
  info:     { label:'Infokasten',    desc:'Merke, Tipp, Definition' },
  table:    { label:'Tabelle',       desc:'zum Ausfüllen' },
  lines:    { label:'Schreibfläche', desc:'Linien oder Kästchen' },
  heading:  { label:'Überschrift',   desc:'Zwischentitel' },
  text:     { label:'Absatz',        desc:'Einleitung, Hinweis' },
  quote:    { label:'Zitat',         desc:'Impuls zum Einstieg' },
  qr:       { label:'QR-Code',       desc:'Link zu Video, Quelle' },
  image:    { label:'Bild',          desc:'Grafik, Schaubild' },
  pagebreak:{ label:'Seitenumbruch', desc:'Rest auf neue Seite' }
};

/* Operatoren: IQB-Grundstock Deutsch (gemeinsamer Abituraufgabenpool) + gebräuchliche Ergänzungen */
const OPS = [
  { op:'analysieren', afb:[1,3], iqb:1 }, { op:'beschreiben', afb:[1,2], iqb:1 },
  { op:'beurteilen', afb:[2,3], iqb:1 }, { op:'charakterisieren', afb:[2,3], iqb:1 },
  { op:'darstellen', afb:[1,2], iqb:1, verb:'stellen', part:'dar', tpl:'Stellen Sie … dar.' },
  { op:'einordnen', afb:[1,2], iqb:1, verb:'ordnen', part:'ein', tpl:'Ordnen Sie … ein.' },
  { op:'erläutern', afb:[2,3], iqb:1 }, { op:'erörtern', afb:[1,3], iqb:1 },
  { op:'in Beziehung setzen', afb:[2,3], iqb:1, verb:'setzen', part:'beziehung', tpl:'Setzen Sie … in Beziehung.' },
  { op:'interpretieren', afb:[1,3], iqb:1 },
  { op:'sich auseinandersetzen', afb:[2,3], iqb:1, verb:'setzen', part:'auseinander', tpl:'Setzen Sie sich mit … auseinander.' },
  { op:'Stellung nehmen', afb:[2,3], iqb:1, verb:'nehmen', part:'stellung', tpl:'Nehmen Sie Stellung zu …' },
  { op:'überprüfen', afb:[2,3], iqb:1 }, { op:'verfassen', afb:[1,3], iqb:1 },
  { op:'vergleichen', afb:[2,3], iqb:1 },
  { op:'zusammenfassen', afb:[1,2], iqb:1, verb:'fassen', part:'zusammen', tpl:'Fassen Sie … zusammen.' },
  { op:'nennen', afb:[1,1] }, { op:'wiedergeben', afb:[1,1], verb:'geben', part:'wieder', tpl:'Geben Sie … wieder.' },
  { op:'skizzieren', afb:[1,2] }, { op:'erklären', afb:[2,2] },
  { op:'herausarbeiten', afb:[2,2], verb:'arbeiten', part:'heraus', tpl:'Arbeiten Sie … heraus.' },
  { op:'untersuchen', afb:[2,2] }, { op:'belegen', afb:[2,2] }, { op:'begründen', afb:[2,3] },
  { op:'prüfen', afb:[2,3] }, { op:'bewerten', afb:[3,3] }, { op:'deuten', afb:[3,3] },
  { op:'diskutieren', afb:[3,3] }, { op:'entwerfen', afb:[3,3] }, { op:'gestalten', afb:[3,3] }
];
const IRREG = { nehmen: 'nimm', geben: 'gib', entwerfen: 'entwirf' };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
OPS.forEach(o => {
  if (!o.tpl) o.tpl = cap(o.op) + ' Sie …';
  const base = o.verb || o.op;
  o.imp = IRREG[base] || (base.endsWith('ern') ? base.slice(0, -1) + 'e' : base.slice(0, -2) + 'e');
  o.tplDu = cap(o.imp) + o.tpl.replace(/^\S+ Sie/, '').replace(/^ sich /, ' dich ');

/* ================= Einfügen aus PDFs ================= */
function cleanPdf(raw) {
  let t = String(raw).replace(/\r\n?/g, '\n').replace(/­/g, ''); let hy = 0, ln = 0;
  t = t.replace(/(\p{L})-[ \t]*\n[ \t]*(\p{Ll})/gu, (m, a, b) => { hy++; return a + b; });
  const lines = t.split('\n');
  const strip = (re, fix) => {
    const nums = []; lines.forEach((l, i) => { const m = l.match(re); if (m && +m[1] % 5 === 0) nums.push([i, +m[1]]); });
    if (nums.length >= 2 && nums.every((x, i) => !i || x[1] > nums[i - 1][1])) nums.forEach(([i]) => { lines[i] = fix(lines[i]); ln++; });
  };
  strip(/^\s*(\d{1,3})\s+\S/, l => l.replace(/^\s*\d{1,3}\s+/, ''));
  strip(/\S\s+(\d{1,3})\s*$/, l => l.replace(/\s+\d{1,3}\s*$/, ''));
  return { t: lines.join('\n'), hy, ln };
}

/* ================= Genderzeichen (Schulvorgabe: ausschreiben) ================= */
const GENDER_RE = /([A-Za-zÄÖÜäöüß]+)(?:\*|:|_|·)(innen|in)(?![a-zäöüß])|([a-zäöüß]+)(Innen)(?![a-zäöüß])/g;
function genderRepl(stem, plural) {
  if (!plural) return `${stem}in oder ${stem}`;
  const masc = /(er|el|en)$/.test(stem) ? stem : /(or|ent|ant|ist|at|og|eg|graf|oph|ent)$/.test(stem) ? stem + 'en' : /e$/.test(stem) ? stem + 'n' : stem + 'e';
  return `${stem}innen und ${masc}`;
}
function genderHits(texts) {
  const out = new Map();
  texts.forEach(t => String(t == null ? '' : t).replace(GENDER_RE, (m, s1, suf1, s2) => { if (!out.has(m)) out.set(m, genderRepl(s1 || s2, (suf1 || 'innen').toLowerCase() === 'innen')); return m; }));
  return [...out].map(([m, r]) => ({ m, r }));
}
function gTargets(bid) {
  const sh = state.sheet;
  if (bid === 'meta') { const m = sh.meta; if (!m.exam) m.exam = {}; return [[m, 'title'], [m, 'topic'], [m.exam, 'label'], [m.exam, 'hilfsmittel'], [m, 'groupA'], [m, 'groupB']]; }
  if (bid === 'karten') return (sh.cards || []).flatMap(c => [[c, 'term'], [c, 'points']]);
  const b = sh.blocks.find(x => x.id === bid); if (!b) return [];
  switch (b.type) {
    case 'tasks': return [[b, 'title'], ...b.items.flatMap(it => [[it, 'text'], [it, 'eh'], [it, 'tag'], ...(Array.isArray(it.tips) ? it.tips.map((_, j) => [it.tips, j]) : [])])];
    case 'info': return [[b, 'title'], [b, 'text']];
    case 'heading': case 'text': return [[b, 'text']];
    case 'table': return [[b, 'title'], ...b.cols.map((_, j) => [b.cols, j]), ...b.rows.flatMap(r => r.map((_, j) => [r, j]))];
    case 'qr': return [[b, 'title'], [b, 'note']];
    case 'image': return [[b, 'caption']];
    default: return [];
  }
}
function gNote(bid) {
  const hits = genderHits(gTargets(bid).map(([o, k]) => o[k]));
  if (!hits.length) return `<div data-gn="${bid}" hidden></div>`;
  return `<div class="gnote" data-gn="${bid}"><b>Genderzeichen</b><span>Laut Schulvorgabe ausschreiben:</span>${hits.map(h => `<span class="gn-hit">„${esc(h.m)}“ <button type="button" class="link" data-act="gfix" data-m="${esc(h.m)}" data-r="${esc(h.r)}">→ ${esc(h.r)}</button></span>`).join('')}</div>`;
}

/* ================= Erwartungshorizont als Markdown ================= */
const plainMd = s => String(s || '').replace(/\*\*([^*]+)\*\*/g, '$1').replace(/\*([^*]+)\*/g, '$1').replace(/\^(\d+)/g, '$1').trim();
function ehMarkdown() {
  const sh = state.sheet, m = sh.meta; const isK = m.mode === 'klausur'; const L = [];
  L.push(`# Erwartungshorizont: ${m.title || 'Ohne Titel'}`, '', [isK ? (m.exam && m.exam.label) || 'Klausur' : '', m.course, m.school, !isK && m.nr ? 'AB ' + m.nr : ''].filter(Boolean).join(' · '));
  if (m.topic && !isK) L.push('', `Thema: ${m.topic}`);
  const mats = sh.blocks.filter(b => b.type === 'material');
  if (mats.length) { L.push('', '## Materialien', ''); mats.forEach((b, i) => L.push(`- **M${i + 1}:** ${plainMd(b.title) || 'ohne Titel'}${b.source ? ` (${plainMd(b.source)})` : ''}`)); }
  L.push('', '## Aufgaben'); let t = 0;
  sh.blocks.forEach(b => {
    if (b.type !== 'tasks') return; if (b.restart) t = 0;
    b.items.forEach(it => {
      t++; const ops = detectOps(it.text); const r = opsRange(ops);
      L.push('', `### Aufgabe ${t}${m.groupsOn && b.group ? ` (Gruppe ${b.group})` : ''}${it.tag ? ` · ${it.tag}` : ''}`, '', `> ${plainMd(it.text) || '–'}`, '');
      const info = [ops.length ? 'Operator: ' + ops.map(o => o.op).join(', ') : '', r ? 'AFB ' + afbLabel(r) : '', SOZ[it.soz] ? SOZ[it.soz].label : '', it.pts ? 'Gewichtung: ' + it.pts : ''].filter(Boolean).join(' · ');
      if (info) L.push(`_${info}_`, '');
      const eh = ehLines(it);
      L.push('**Erwartung**', '', ...(eh.length ? eh.map(s => `- ${plainMd(s)}`) : ['- (noch offen)']));
      const tips = tipsOf(it); if (tips.length) L.push('', '**Gestufte Hilfen**', '', ...tips.map((s, j) => `${j + 1}. ${plainMd(s)}`));
    });
  });
  return L.join('\n') + '\n';
}

    }
    if (cur().used + gap + it.h <= AVAIL) { cur().list.push({ it, whole: true }); cur().used += gap + it.h; continue; }

/* ---------- Bilder ---------- */
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function handleImage(file, b) {
  try {
    const url = URL.createObjectURL(file); const img = await loadImg(url);
    const inDb = backend && backend.kind === 'claude';
    const max = store.assets ? 1600 : (inDb ? 1000 : 1400);
    let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
    b.w = w; b.h = h; b.src = '';
    if (store.assets) {
      try { const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .86)); const up = await store.assets.upload(blob); b.src = up.url; b.assetId = up.id; } catch (err) { b.src = ''; }
    }
    if (!b.src) b.src = c.toDataURL('image/jpeg', inDb ? .72 : .84);

/* ================= Ablage ================= */
/* Drei Speicherorte mit gleicher Schnittstelle (list, load, save, remove):
   local    – nur dieser Browser (Standard auf GitHub Pages, solange SUPABASE leer ist)
   supabase – Online-Ablage, nach Anmeldung; nur das eigene Konto sieht seine Zeilen
   claude   – Ablage des claude.ai-Kontos, wenn die Seite als Artifact läuft */
const LS = { lib: 'abw.lib', last: 'abw.last', klasse: 'abw.klasse', cur: 'abw.cur', pending: 'abw.pending', skip: 'abw.nologin' };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };
const inClaude = !!(window.claude && typeof window.claude.use === 'function');
function localLib() { return lsGet(LS.lib) || {}; }
function entryOf(sh) { return { id: sh.id, klasse: KL(sh.klasse).id, title: sh.meta.title || 'Ohne Titel', nr: String(sh.meta.nr || ''), updatedAt: sh.updatedAt || 0 }; }

const localB = {
  kind: 'local', key: 'local',
  async list() { return Object.values(localLib()).filter(d => d && d.sheet && d.sheet.meta).map(d => ({ ...entryOf(d.sheet), updatedAt: d.updatedAt || d.sheet.updatedAt || 0 })); },
  async load(id) { const d = localLib()[id]; return d && d.sheet ? clone(d.sheet) : null; },
  async save(sh) { const lib = localLib(); lib[sh.id] = { updatedAt: sh.updatedAt, sheet: sh }; if (!lsSet(LS.lib, lib)) throw { code: 'quota' }; },
  async remove(id) { const lib = localLib(); delete lib[id]; lsSet(LS.lib, lib); }
};
function claudeB(db, id) {
  const col = () => db.collection('data/users/' + id);
  return {
    kind: 'claude', key: 'claude:' + id,
    async list() {
      const snap = await col().get();
      return snap.docs.filter(d => d.exists && d.data() && d.data().sheet).map(d => { const x = d.data(); return { id: d.id, klasse: KL(x.klasse).id, title: x.title || 'Ohne Titel', nr: String(x.nr || ''), updatedAt: x.updatedAt || 0 }; });
    },
    async load(docId) { const d = await col().doc(docId).get(); return d.exists && d.data().sheet ? clone(d.data().sheet) : null; },
    async save(sh) {
      const body = { kind: 'sheet', ...entryOf(sh), sheet: sh };
      if (JSON.stringify(body).length > 250000) throw { code: 'toolarge' };
      try { await col().doc(sh.id).set(body); } catch (e) { throw (e && e.code === 'invalid_argument') ? { code: 'toolarge' } : e; }
    },
    async remove(docId) { await col().doc(docId).delete(); }
  };
}
function supaB(sb, user) {
  const T = () => sb.from('worksheets');
  const chk = r => { if (r.error) throw r.error; return r.data; };
  return {
    kind: 'supabase', key: 'sb:' + user.id,
    async list() {
      const rows = chk(await T().select('id,klasse,title,nr,updated_at').order('updated_at', { ascending: false })) || [];
      return rows.map(r => ({ id: r.id, klasse: KL(r.klasse).id, title: r.title || 'Ohne Titel', nr: r.nr || '', updatedAt: Date.parse(r.updated_at) || 0 }));
    },
    async load(id) { const d = chk(await T().select('data').eq('id', id).maybeSingle()); return d && d.data ? d.data : null; },
    async save(sh) { chk(await T().upsert({ id: sh.id, klasse: KL(sh.klasse).id, title: sh.meta.title || 'Ohne Titel', nr: String(sh.meta.nr || ''), data: sh, updated_at: new Date(sh.updatedAt || Date.now()).toISOString() })); },
    async remove(id) { chk(await T().delete().eq('id', id)); }

}

/* ---------- Status ---------- */
const STATUS = {
  pending: 'Wird geladen …', saving: 'Speichert …',
  supabase: 'Online gespeichert', claude: 'Gespeichert in „Meine Blätter“', local: 'Gespeichert in diesem Browser',
  offline: 'Noch nicht online · lokal gesichert, wird nachgeholt', error: 'Nicht gespeichert · nächste Änderung versucht es erneut',

function setStatus(s) {

  const n = $('#status'); n.dataset.s = s; n.querySelector('span').textContent = txt;
}
function idleStatus() { setStatus(state.sheet.example ? 'example' : (backend ? backend.kind : 'pending')); }

/* ---------- Liste, Reiter ---------- */
function sortLib() { state.lib.sort((a, b) => b.updatedAt - a.updatedAt); }
function upsertLib(e) { const i = state.lib.findIndex(d => d.id === e.id); if (i >= 0) state.lib[i] = e; else state.lib.push(e); sortLib(); renderTabs(); if (state.libOpen) renderLib(); }

function nextNr(k) { let m = 0; state.lib.forEach(d => { if (d.klasse !== k) return; const n = parseInt(d.nr, 10); if (n > m) m = n; }); return m ? String(m + 1) : ''; }
function renderTabs() {
  const counts = {}; state.lib.forEach(d => { counts[d.klasse] = (counts[d.klasse] || 0) + 1; });
  $('#reiter').innerHTML = KLASSEN.map(k => `<button type="button" role="tab" class="rt" data-k="${k.id}" aria-selected="${state.klasse === k.id}"><i style="background:${ACCENTS[k.accent].c}"></i>${esc(k.label)}${counts[k.id] ? `<span>${counts[k.id]}</span>` : ''}</button>`).join('');
}

/* ---------- Zwischenspeicher für Änderungen, die online noch fehlen ---------- */
const pendKey = b => LS.pending + '.' + b.key;
function addPending(b, sh) { const p = lsGet(pendKey(b)) || {}; p[sh.id] = sh; lsSet(pendKey(b), p); }
function dropPending(b, id) { const p = lsGet(pendKey(b)); if (p && p[id]) { delete p[id]; lsSet(pendKey(b), p); } }
async function flushPending() {
  const b = backend; if (!b || b.kind === 'local') return;
  const p = lsGet(pendKey(b)) || {}; const ids = Object.keys(p); if (!ids.length) return;
  for (const id of ids) {
    const sh = p[id]; const srv = state.lib.find(d => d.id === id);
    if (srv && srv.updatedAt >= (sh.updatedAt || 0)) { delete p[id]; continue; }
    try { await b.save(sh); delete p[id]; upsertLib(entryOf(sh)); } catch { break; }
  }
  lsSet(pendKey(b), p);
}

/* ---------- Speichern ---------- */
function rememberLast(sh) {
  const last = lsGet(LS.last) || {}; last[sh.klasse] = sh.id; lsSet(LS.last, last);
  lsSet(LS.cur, { sheet: sh });
}
let saveTimer = null, savePending = false, saveChain = Promise.resolve();
function scheduleSave() { clearTimeout(saveTimer); savePending = true; saveTimer = setTimeout(saveNow, 1100); }
// Nimmt den Stand sofort auf und speichert der Reihe nach; so geht beim Wechseln nichts verloren.
function saveNow() {
  clearTimeout(saveTimer);
  const sh = state.sheet;
  if (!sh || sh.example) { savePending = false; return saveChain; }
  if (!backend) { savePending = true; return saveChain; }
  savePending = false;
  sh.updatedAt = Date.now();
  const snap = clone(sh), b = backend;
  rememberLast(snap); setStatus('saving');
  saveChain = saveChain.then(() => doSave(b, snap)).catch(() => {});
  return saveChain;
}

  const mine = () => state.sheet && state.sheet.id === snap.id;
  try {
    await b.save(snap);
    if (b.kind !== 'local') dropPending(b, snap.id);
    if (b === backend) upsertLib(entryOf(snap));
    if (mine() && !savePending) setStatus(b.kind);
    if (b.kind !== 'local') flushPending();
  } catch (err) {
    const code = err && err.code;
    if (b.kind !== 'local' && code !== 'toolarge') { addPending(b, snap); if (mine()) setStatus('offline'); }
    else if (mine()) setStatus(code === 'toolarge' ? 'toolarge' : code === 'quota' ? 'quota' : 'error');
  }
}

/* ---------- Öffnen, Reiter wechseln ---------- */

/* ---------- Speicherort wählen ---------- */
async function useBackend(b) {
  const t = ++backendToken;
  backend = b; setStatus('pending');
  let listed = true;
  try { await refreshLib(); } catch (err) { console.error(err); listed = false; }
  if (t !== backendToken) return;
  updateAccountUI();
  if (!listed) {
    state.lib = []; renderTabs(); setStatus('offline');
    toast('Die Ablage ist gerade nicht erreichbar. Änderungen werden lokal gesichert und später nachgetragen.');
    return;
  }
  await flushPending();

  state.touched = false;
}
async function initBackend() {
  if (inClaude) {
    const get = n => window.claude.use(n).catch(() => null);
    const [db, user, dl, assets] = await Promise.all([get('db'), get('user'), get('downloads'), get('assets')]);
    store.dl = dl; store.assets = assets;
    let id = null; if (db && user) { try { id = await user.id(); } catch {} }
    return useBackend(id ? claudeB(db, id) : localB);
  }
  if (SUPABASE.url && SUPABASE.key) {
    try {
      await loadScript(LIBS.supa);
      const sb = window.supabase.createClient(SUPABASE.url, SUPABASE.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'abw-auth' } });
      store.sb = sb;
      const { data } = await sb.auth.getSession();
      store.user = data && data.session ? data.session.user : null;
      sb.auth.onAuthStateChange((ev, session) => setTimeout(() => onAuth(ev, session), 0));
      await useBackend(store.user ? supaB(sb, store.user) : localB);
      if (store.user) offerMigration();
      else if (!lsGet(LS.skip)) openDlg('login');
      return;
    } catch (err) {
      console.error(err); store.sb = null; store.user = null;

    }

}

  const user = (session && session.user) || null;
  const cur = store.user && store.user.id;
  if (user && user.id !== cur) {
    store.user = user;
    if (state.dlg && state.dlg.mode === 'login') closeDlg();
    useBackend(supaB(store.sb, user)).then(offerMigration);
  } else if (!user && cur) {

}

/* ---------- Blätter aus diesem Browser in die Online-Ablage ---------- */

  const n = Object.keys(localLib()).length; if (!n) return;

}
