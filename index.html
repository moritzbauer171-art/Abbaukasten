    const XH = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    const documentXml = `${XH}<w:document ${NS}><w:body>${body}</w:body></w:document>`;
    const footLeft = [m.school, m.course].filter(Boolean).join(' · ');
    const footerXml = `${XH}<w:ftr ${NS}><w:p><w:pPr><w:pBdr><w:top w:val="single" w:sz="4" w:space="4" w:color="C8CCD5"/></w:pBdr><w:tabs><w:tab w:val="right" w:pos="${CW}"/></w:tabs><w:spacing w:before="0" w:after="0"/></w:pPr>${xr(footLeft, { sz: 15, color: GREY })}<w:r><w:rPr><w:sz w:val="15"/></w:rPr><w:tab/></w:r>${xr((tagW ? tagW + ' · ' : '') + (!isK && m.nr ? 'AB ' + m.nr + ' · ' : '') + 'Seite ', { sz: 15, color: GREY })}<w:fldSimple w:instr=" PAGE "><w:r><w:rPr><w:color w:val="${GREY}"/><w:sz w:val="15"/></w:rPr><w:t>1</w:t></w:r></w:fldSimple></w:p></w:ftr>`;
    const stylesXml = `${XH}<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="${SANS}" w:eastAsia="${SANS}" w:hAnsi="${SANS}" w:cs="${SANS}"/><w:color w:val="1C1F27"/><w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="de-DE" w:eastAsia="de-DE" w:bidi="ar-SA"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>`
      + `<w:style w:type="paragraph" w:default="1" w:styleId="Standard"><w:name w:val="Normal"/><w:qFormat/></w:style>`
      + `<w:style w:type="paragraph" w:customStyle="1" w:styleId="Materialtext"><w:name w:val="Materialtext"/><w:basedOn w:val="Standard"/><w:qFormat/><w:pPr><w:spacing w:after="0" w:line="300" w:lineRule="auto"/><w:jc w:val="both"/></w:pPr><w:rPr><w:rFonts w:ascii="${SERIF}" w:hAnsi="${SERIF}" w:cs="${SERIF}"/><w:sz w:val="21"/><w:szCs w:val="21"/></w:rPr></w:style>`
      + `<w:style w:type="character" w:styleId="Zeilennummer"><w:name w:val="line number"/><w:basedOn w:val="Absatz-Standardschriftart"/><w:uiPriority w:val="99"/><w:semiHidden/><w:unhideWhenUsed/><w:rPr><w:rFonts w:ascii="${SANS}" w:hAnsi="${SANS}"/><w:color w:val="7A808C"/><w:sz w:val="14"/><w:szCs w:val="14"/></w:rPr></w:style>`
      + `<w:style w:type="character" w:default="1" w:styleId="Absatz-Standardschriftart"><w:name w:val="Default Paragraph Font"/><w:uiPriority w:val="1"/><w:semiHidden/><w:unhideWhenUsed/></w:style>`
      + `<w:style w:type="table" w:default="1" w:styleId="NormaleTabelle"><w:name w:val="Normal Table"/><w:uiPriority w:val="99"/><w:semiHidden/><w:unhideWhenUsed/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style></w:styles>`;
    const settingsXml = `${XH}<w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:defaultTabStop w:val="708"/><w:hyphenationZone w:val="425"/><w:characterSpacingControl w:val="doNotCompress"/><w:compat><w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat></w:settings>`;
    const rels = `${XH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdSettings" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/><Relationship Id="rIdFtr" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>${media.map(x => `<Relationship Id="rIdImg${x.n}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/bild${x.n}.${x.ext || 'jpeg'}"/>`).join('')}</Relationships>`;
    const ct = `${XH}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`;
    const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    const core = `${XH}<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xesc((m.nr ? 'AB ' + m.nr + ' – ' : '') + (m.title || ''))}</dc:title><dc:subject>${xesc(m.topic || '')}</dc:subject><dc:language>de-DE</dc:language><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`;
    const rootRels = `${XH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`;
    const zip = new window.JSZip();
    zip.file('[Content_Types].xml', ct); zip.file('_rels/.rels', rootRels); zip.file('docProps/core.xml', core);
    zip.file('word/document.xml', documentXml); zip.file('word/styles.xml', stylesXml); zip.file('word/settings.xml', settingsXml);
    zip.file('word/footer1.xml', footerXml); zip.file('word/_rels/document.xml.rels', rels);
    media.forEach(x => zip.file(`word/media/bild${x.n}.${x.ext || 'jpeg'}`, x.bytes));
    const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    overlay('');
    await deliver(fileBase() + outSuffix().replace('_A5', '') + '.docx', blob);
  } catch (err) { console.error(err); overlay(''); toast('Word-Datei konnte nicht erstellt werden. Bitte erneut versuchen.'); }
  finally { overlay(''); busy = false; }
}

/* ================= Ansicht, Drucken ================= */
function setView(v) {
  state.view = v;
  $('#tab-edit').setAttribute('aria-pressed', v === 'edit'); $('#tab-prev').setAttribute('aria-pressed', v === 'preview');
  applyResponsive();
}
function applyResponsive() {
  const narrow = window.matchMedia('(max-width: 899px)').matches;
  $('#editor').hidden = narrow && state.view !== 'edit';
  $('#preview').hidden = narrow && state.view !== 'preview';
  applyScale();
}
function doPrint() {
  const pr = $('#printroot'); pr.innerHTML = '';
  const pages = [...document.querySelectorAll('#pages .pout')]; if (!pages.length) { toast('Es gibt noch nichts zu drucken.'); return; }
  const w = +pages[0].dataset.w || 210, h = +pages[0].dataset.h || 297;
  let st = document.getElementById('print-size'); if (!st) { st = document.createElement('style'); st.id = 'print-size'; document.head.appendChild(st); }
  const ori = p => (+p.dataset.w || 210) > (+p.dataset.h || 297) ? 'quer' : 'hoch';
  const mixed = new Set(pages.map(ori)).size > 1;
  st.textContent = mixed ? '@media print{@page{margin:0}@page quer{size:297mm 210mm;margin:0}@page hoch{size:210mm 297mm;margin:0}}' : `@media print{@page{size:${w}mm ${h}mm;margin:0}}`;
  pages.forEach(p => { const c = p.cloneNode(true); c.style.transform = 'none'; c.style.position = 'relative'; if (mixed) c.style.setProperty('page', ori(p)); c.querySelectorAll('.is-sel,.zsel').forEach(n => n.classList.remove('is-sel', 'zsel')); pr.appendChild(c); });
  window.print();
}

/* ================= Start ================= */
function boot() {
  const ed = $('#editor');
  ed.addEventListener('input', onInput); ed.addEventListener('change', onChange); ed.addEventListener('click', onClick);
  $('#lib-root').addEventListener('click', onLibClick);
  $('#lib-root').addEventListener('input', e => { if (e.target.id === 'lib-q') { state.libQuery = e.target.value; renderLib(); } });
  $('#dlg-root').addEventListener('click', onDlgClick);
  $('#dlg-root').addEventListener('submit', onDlgSubmit);
  $('#import-file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });
  $('#reiter').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) switchKlasse(b.dataset.k); });
  $('#outsw').addEventListener('click', e => { const b = e.target.closest('[data-out]'); if (b) setOut(b.dataset.out); });
  $('#pv-opts').addEventListener('click', e => {
    const b = e.target.closest('[data-pv]'); if (!b) return; const k = b.dataset.pv, v = b.dataset.v;
    if (k === 'ehmd') { exportEH(); return; }
    if (k === 'fassung') { state.fassung = v; if (v === 'lehrer') state.sheet.blocks.forEach(x => { if (x.type === 'tasks') x.items.forEach((_, i) => state.taskOpen.add(taskKey(x.id, i, 'eh'))); }); renderEditor(); }
    if (k === 'grp') state.grp = v;
    if (k === 'paper') { state.sheet.meta.paper = v; changed(false); }
    closeZl(); renderPreview();
  });
  $('#menu-root').addEventListener('click', onMenuClick);
  $('#zl-root').addEventListener('click', e => { const a = e.target.closest('[data-zl]'); if (!a) return; const k = a.dataset.zl; if (k === 'close') closeZl(); if (k === 'ins') zlInsert(); if (k === 'copy') zlCopy(); });
  const trackField = e => {
    const t = e.target; if (!t.dataset || !t.dataset.k || !/^(INPUT|TEXTAREA)$/.test(t.tagName) || t.type === 'checkbox') return;
    const card = t.closest('[data-bid]'); const bid = card && card.dataset.bid; const blk = bid && state.sheet.blocks.find(x => x.id === bid);
    if (!blk || blk.type === 'material') return;
    lastField.bid = bid; lastField.k = t.dataset.k; lastField.pos = t.selectionStart; lastField.end = t.selectionEnd;
  };
  ['focusin', 'keyup', 'mouseup', 'input', 'focusout'].forEach(ev => ed.addEventListener(ev, trackField));
  ed.addEventListener('paste', e => {
    const t = e.target; if (t.tagName !== 'TEXTAREA' || t.dataset.k !== 'text') return;
    const card = t.closest('[data-bid]'); const blk = card && target(card.dataset.bid); if (!blk || blk.type !== 'material') return;
    const raw = e.clipboardData && e.clipboardData.getData('text'); if (!raw) return;
    const r = cleanPdf(raw); if (!r.hy && !r.ln) return;
    e.preventDefault();
    let ok = false; try { ok = document.execCommand('insertText', false, r.t); } catch {}
    if (!ok) { t.setRangeText(r.t, t.selectionStart, t.selectionEnd, 'end'); t.dispatchEvent(new Event('input', { bubbles: true })); }
    toast([r.hy ? `${r.hy} Trennstriche` : '', r.ln ? `${r.ln} Zeilennummern` : ''].filter(Boolean).join(' und ') + ' aus der Vorlage entfernt');
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (menu.open) { closeMenu(); return; }
    if (zl.open) { closeZl(); return; }
    if (gl.open) { closeGloss(); return; }
    if (state.dlg) { if (state.dlg.mode === 'login') lsSet(LS.skip, true); closeDlg(); return; }
    if (state.libOpen) { state.libOpen = false; state.confirmDel = null; renderLib(); }
  });
  $('.bar').addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'tab') setView(a.dataset.v);
    if (act === 'lib-open') {
      state.libOpen = true; renderLib(); refreshLib().catch(() => {});
      const q = $('#lib-q'); if (q && !window.matchMedia('(max-width: 899px)').matches) q.focus();
    }
    if (act === 'login') openDlg('login');
    if (act === 'pdf') exportPDF();
    if (act === 'docx') exportDOCX();
    if (act === 'print') doPrint();
  });
  $('#btn-zoom').addEventListener('click', () => { state.zoom = state.zoom === 'fit' ? 'full' : 'fit'; applyScale(); });
  $('#gl-root').addEventListener('submit', onGlossSubmit);
  $('#gl-root').addEventListener('input', e => { if (e.target.id === 'gl-term') updOcc(); });
  $('#gl-root').addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a || !gl.open) return;
    if (a.dataset.act === 'gl-close') closeGloss();
    if (a.dataset.act === 'gl-del') { const o = gl.open; const b = target(o.bid); closeGloss(); if (b && o.idx >= 0) removeGloss(b, o.idx); }
  });
  document.addEventListener('pointerdown', e => {
    if (gl.open && !e.target.closest('#gpop')) closeGloss();
    if (zl.open && !e.target.closest('#zlpop') && !e.target.closest('#pages .ln-no')) closeZl();
    if (menu.open && !e.target.closest('#mn')) closeMenu();
  }, true);
  // Schließt erst, wenn wirklich weggescrollt wurde (kleine Sprünge durch Fokus ignorieren)
  ['#preview-scroll', '#editor'].forEach(q => $(q).addEventListener('scroll', () => {
    const o = gl.open; if (!o || !o.sc || narrowGloss()) return;
    if (Math.abs($('#preview-scroll').scrollTop - o.sc.p) > 60 || Math.abs($('#editor').scrollTop - o.sc.e) > 60) closeGloss();
  }, { passive: true }));
  window.addEventListener('resize', () => { if (gl.open) placeGloss(); });
  const selectQuiet = bid => {
    state.sel = bid; markSel();
    document.querySelectorAll('#editor .card.sel').forEach(c => c.classList.remove('sel'));
    const c = document.querySelector(`#editor .card[data-bid="${bid}"]`); if (c) c.classList.add('sel');
  };
  let skipClick = false;
  // Mehrere Wörter markieren → Worterklärung für die Wortgruppe
  $('#pages').addEventListener('mouseup', () => {
    const sel = window.getSelection(); if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    const r = sel.getRangeAt(0); const sc = r.startContainer;
    const blk = (sc.nodeType === 1 ? sc : sc.parentElement).closest('.blk-mat'); if (!blk) return;
    const bid = blk.dataset.bid;
    const picked = [...document.querySelectorAll(`#pages [data-bid="${bid}"] .mat-body .w`)].filter(w => r.intersectsNode(w));
    if (!picked.length) return;
    const rect = rectOf(r); sel.removeAllRanges();
    skipClick = true; setTimeout(() => { skipClick = false; }, 350);
    selectQuiet(bid); glossFromSpans(bid, picked, rect);
  });
  $('#pages').addEventListener('click', e => {
    if (skipClick) { skipClick = false; return; }
    const lnno = e.target.closest('.ln-no');
    if (lnno && lnno.dataset.n) {
      const blk = lnno.closest('.blk-mat');
      if (blk) { const lab = blk.querySelector('.mat-no, .mat-cont'); const mNo = lab ? +((lab.textContent.match(/M(\d+)/) || [])[1] || 0) : 0; selectQuiet(blk.dataset.bid); openZl(blk.dataset.bid, +lnno.dataset.n, mNo, rectOf(lnno)); return; }
    }
    const w = e.target.closest('.mat-body .w'); const wb = w && w.closest('.blk-mat');
    if (wb) { selectQuiet(wb.dataset.bid); glossFromSpans(wb.dataset.bid, [w], rectOf(w)); return; }
    const n = e.target.closest('[data-bid]'); if (!n) return;
    const bid = n.dataset.bid; state.sel = bid; state.closed.delete(bid);
    if (window.matchMedia('(max-width: 899px)').matches) setView('edit');
    renderEditor(); markSel();
    const c = $(`#editor [data-bid="${bid}"]`); if (c) c.scrollIntoView({ block: 'start', behavior: 'smooth' });
  });
  if (canPrint) $('#btn-print').hidden = false;
  window.matchMedia('(max-width: 899px)').addEventListener('change', applyResponsive);
  try { new ResizeObserver(() => applyScale()).observe($('#preview-scroll')); } catch { window.addEventListener('resize', applyScale); }
  window.addEventListener('online', () => { flushPending().then(() => { if (state.sheet && !savePending) idleStatus(); }); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && savePending) saveNow(); });
  window.addEventListener('pagehide', () => { if (savePending) saveNow(); });

  // Erster Stand: zuletzt geöffnetes Blatt dieses Reiters aus dem Zwischenspeicher, sonst Entwurf
  const k = lsGet(LS.klasse); state.klasse = KLASSEN.some(x => x.id === k) ? k : 'gk';
  const cached = lsGet(LS.cur);
  const ok = cached && cached.sheet && cached.sheet.meta && Array.isArray(cached.sheet.blocks) && KL(cached.sheet.klasse).id === state.klasse;
  state.sheet = normalizeSheet(ok ? cached.sheet : draftFor(state.klasse));
  renderTabs(); renderEditor(); applyResponsive(); renderPreview(); setStatus('pending');
  Promise.race([Promise.all(FONT_SPECS.map(f => document.fonts.load(f))), wait(3500)]).then(() => { fontsOK = true; renderPreview(); }).catch(() => {});
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => scheduleRender(60));
  initBackend().catch(err => { console.error(err); useBackend(localB); });
}
boot();

})();
</script>
