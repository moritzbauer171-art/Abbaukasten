<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Arbeitsblätter für den Deutschunterricht aus Bausteinen setzen und als PDF oder Word speichern.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AB-Werkstatt Deutsch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400;1,7..72,600&display=swap">
<style>
/* Layout: Arbeitspult – links die Bausteine (Editor), rechts das Papier (A4-Vorschau). Papier bleibt in beiden Themes weiß. */
:root{
  --desk:#E3E6ED; --panel:#F5F6F9; --card:#FFFFFF; --field:#FFFFFF;
  --line:#D4D9E3; --line-strong:#B6BDCB;
  --ink:#1A1E29; --muted:#5A6277; --faint:#878FA3;
  --tinte:#2741B5; --tinte-ink:#FFFFFF; --tinte-soft:#E4E9FA;
  --warn:#8F5300; --warn-soft:#FDF0D5;
  --afb1:#2F6B8A; --afb2:#2741B5; --afb3:#7B2C6F;
  --shadow:0 1px 2px rgba(22,30,52,.10), 0 10px 28px rgba(22,30,52,.12);
  --paper:#FFFFFF; --paper-ink:#1C1F27; --paper-muted:#5A606E; --paper-rule:#8E95A3; --paper-hair:#C8CCD5;
  --f-ui:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-text:"Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#11141B; --panel:#181C25; --card:#1F2430; --field:#151922;
  --line:#2C3241; --line-strong:#3E4659;
  --ink:#E6E9F0; --muted:#A3ABBD; --faint:#7D8598;
  --tinte:#93A6FF; --tinte-ink:#0E1430; --tinte-soft:#232B4B;
  --warn:#F0B55C; --warn-soft:#3A2B10;
  --afb1:#8CC3E3; --afb2:#9EB0FF; --afb3:#E39BD4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#11141B; --panel:#181C25; --card:#1F2430; --field:#151922;
  --line:#2C3241; --line-strong:#3E4659;
  --ink:#E6E9F0; --muted:#A3ABBD; --faint:#7D8598;
  --tinte:#93A6FF; --tinte-ink:#0E1430; --tinte-soft:#232B4B;
  --warn:#F0B55C; --warn-soft:#3A2B10;
  --afb1:#8CC3E3; --afb2:#9EB0FF; --afb3:#E39BD4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tinte);outline-offset:2px}

/* ---------- App-Gerüst ---------- */
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:10px 4px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-text);font-weight:700;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.status[data-s="supabase"] i,.status[data-s="claude"] i,.status[data-s="local"] i{background:#2E8A5C}
.status[data-s="saving"] i{background:var(--tinte)}
.status[data-s="error"] i,.status[data-s="toolarge"] i,.status[data-s="offline"] i,.status[data-s="quota"] i{background:#C2410C}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--tinte)}
.btn.primary{background:var(--tinte);color:var(--tinte-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.tabs{display:none;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.l-short{display:none}
.f textarea,.task-ed textarea{field-sizing:content;max-height:60vh}
.tabs button{border:0;background:transparent;padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--tinte);color:var(--tinte-ink)}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,450px) minmax(0,1fr);gap:0}
.pane{min-height:0;min-width:0;overflow:auto}
#editor{background:var(--panel);border-right:1px solid var(--line);padding:14px 14px 40px;display:flex;flex-direction:column;gap:10px;margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding-left:max(16px, env(safe-area-inset-left, 0px))}
#preview{display:flex;flex-direction:column;min-width:0}
.pv-bar{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:10px 16px 0;color:var(--muted);font-size:12.5px}
.pv-hint{font-size:12px;color:var(--faint)}
.pv-bar .sp{margin-right:auto}
#preview-scroll{flex:1;overflow:auto;padding:14px 16px 48px}
#pages{display:flex;flex-direction:column;align-items:center;gap:22px}
.slot{position:relative;flex:0 0 auto}
.slot>.page{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:var(--shadow)}
.pg-warn{position:absolute;left:8px;bottom:8px;background:#C2410C;color:#fff;font:700 11px/1.3 var(--f-ui);padding:4px 8px;border-radius:6px;z-index:2}

/* ---------- Editor-Karten ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0}
.card.sel{border-color:var(--tinte);box-shadow:0 0 0 2px var(--tinte-soft)}
.card-h{display:flex;align-items:center;gap:8px;padding:9px 8px 9px 12px;cursor:pointer;user-select:none;min-width:0}
.card-h .kind{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);flex:0 0 auto}
.card-h .sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.card-h .sum.dim{color:var(--faint);font-weight:400}
.ib{width:30px;height:30px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:7px;color:var(--muted);cursor:pointer;flex:0 0 auto}
.ib:hover{background:var(--tinte-soft);color:var(--ink)}
.ib svg{width:16px;height:16px}
.ib[disabled]{opacity:.3;cursor:default;background:transparent}
.card-b{padding:2px 12px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.card.closed .card-b{display:none}
.card.closed .card-h{border-radius:10px}
.memo-flag{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:7px;padding:6px 9px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span,.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.f small{font-size:11.5px;color:var(--faint)}
.f input[type=text],.f input[type=number],.f textarea,.f select,.inp{width:100%;border:1px solid var(--line-strong);background:var(--field);border-radius:7px;padding:7px 9px;font-size:14px;min-width:0}
.f textarea{resize:vertical;line-height:1.45}
.f textarea.serif{font-family:var(--f-text);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.f{flex:1 1 120px}
.row>.f.narrow{flex:0 0 80px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--tinte);margin:0}
.chks{display:flex;flex-wrap:wrap;gap:8px 18px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:4px 10px 4px 5px;background:var(--field);cursor:pointer;font-size:12.5px;font-weight:700}
.sw i{width:16px;height:16px;border-radius:50%;display:block}
.sw[aria-pressed="true"]{border-color:var(--tinte);box-shadow:0 0 0 2px var(--tinte-soft)}
.task-ed{border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:7px;background:var(--panel)}
.task-ed-h{display:flex;align-items:center;gap:6px}
.task-ed-h .no{width:24px;height:24px;border-radius:6px;background:var(--tinte);color:var(--tinte-ink);font-weight:700;font-size:12.5px;display:grid;place-items:center;flex:0 0 auto}
.task-ed-h select{flex:1;min-width:0;border:1px solid var(--line-strong);background:var(--field);border-radius:7px;padding:4px 6px;font-size:12.5px}
.task-ed textarea{width:100%;border:1px solid var(--line-strong);background:var(--field);border-radius:7px;padding:7px 9px;resize:vertical;min-height:58px}
.task-ed .tag{width:100%;border:1px solid var(--line-strong);background:var(--field);border-radius:7px;padding:5px 9px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.5;white-space:nowrap}
.chip.a1{color:var(--afb1)}.chip.a2{color:var(--afb2)}.chip.a3{color:var(--afb3)}
.chip.extra{border-style:dashed}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.prog{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.prog b{color:var(--ink)}
.link{border:0;background:none;color:var(--tinte);font-weight:700;font-size:13px;cursor:pointer;padding:2px 0;text-align:left}
.link.danger{color:#C2410C}
.tbl-ed{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl-ed table{border-collapse:collapse;min-width:100%}
.tbl-ed td{border:1px solid var(--line);padding:0;min-width:110px}
.tbl-ed tr:first-child td{background:var(--tinte-soft)}
.tbl-ed input{width:100%;border:0;background:transparent;padding:6px 8px;font-size:13px}
.tbl-ed tr:first-child input{font-weight:700}
.thumb{max-width:100%;max-height:160px;border-radius:6px;border:1px solid var(--line);align-self:flex-start;background:#fff}
.hint{font-size:12px;color:var(--faint)}
.adder{border:1px dashed var(--line-strong);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.adder .lbl{margin:0}
.adder-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.add-b{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left;min-width:0}
.add-b:hover{border-color:var(--tinte)}
.add-b b{font-size:13.5px}
.add-b span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ---------- Worterklärungen ---------- */
.gl-list{display:flex;flex-direction:column;gap:6px}
.gl-row{display:grid;grid-template-columns:22px minmax(0,auto) minmax(0,1fr) 30px;align-items:center;gap:8px}
.gl-no{width:22px;height:22px;border-radius:6px;background:var(--tinte-soft);color:var(--tinte);font-weight:700;font-size:12px;display:grid;place-items:center}
.gl-w{border:0;background:none;padding:0;font-family:var(--f-text);font-weight:600;font-size:14px;color:var(--ink);cursor:pointer;text-align:left;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.gl-w:hover{color:var(--tinte);text-decoration:underline}
.gl-row input{width:100%;min-width:0;border:1px solid var(--line-strong);background:var(--field);border-radius:7px;padding:6px 8px;font-size:13.5px}
.gl-row.miss .gl-no{background:var(--warn-soft);color:var(--warn)}
.gl-miss,.gl-warn{font-size:12px;color:var(--warn)}
.gl-add{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.gl-add .btn{padding:5px 10px;font-size:13px}
.gl-add small{font-size:11.5px;color:var(--faint)}
.gl-scrim{position:fixed;inset:0;z-index:54;background:rgba(10,14,24,.38);display:none}
.gpop{position:fixed;z-index:55;left:16px;top:16px;width:min(340px,calc(100% - 32px));background:var(--card);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.gpop-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gpop-h span{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.gpop form{display:flex;flex-direction:column;gap:10px}
.gl-term{font-family:var(--f-text);font-size:19px;font-weight:600;line-height:1.25;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;overflow-wrap:anywhere}
.gl-term span{font-family:var(--f-ui);font-size:12px;font-weight:400;color:var(--muted)}
.gpop .err{color:#C2410C;font-size:13px;font-weight:700}
.gpop .err:empty{display:none}
.gpop-a{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gpop-a small{font-size:11.5px;color:var(--faint)}
@media (max-width:599px){
  .gl-scrim{display:block}
  .gpop-a small{display:none}
  .gpop{left:0!important;right:0;top:auto!important;bottom:0;width:100%;border-radius:16px 16px 0 0;border-width:1px 0 0;
    padding:14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
}

/* ---------- Formatierung (Unterbereich in der Materialkarte) ---------- */
.sub{border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.sub-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;cursor:pointer;text-align:left;min-width:0;border-radius:9px}
.sub-h:hover .sub-t{color:var(--tinte)}
.sub-t{font-size:12.5px;font-weight:700;color:var(--ink);flex:0 0 auto}
.sub-s{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-h svg{width:14px;height:14px;flex:0 0 auto;color:var(--muted);transition:transform .15s}
.sub.open .sub-h svg{transform:rotate(180deg)}
.sub-b{padding:10px 10px 12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.seg{display:inline-flex;align-self:flex-start;max-width:100%;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--field)}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--tinte);color:var(--tinte-ink)}

/* ---------- Bibliothek ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);
  padding:calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) 16px}
.drawer-h{display:flex;align-items:center;gap:8px}
.drawer-h h2{font-family:var(--f-text);font-size:20px;margin:0}
.drawer-h .dh{margin-right:auto;display:flex;align-items:baseline;gap:10px;min-width:0}
.drawer-h .dh span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.drawer p.note{font-size:12.5px;color:var(--muted);margin:6px 0 12px}
.drawer .row{margin-bottom:10px}
.lib-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.lib-item{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.lib-item.cur{border-color:var(--tinte)}
.lib-item .t{font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.lib-item .t em{font-style:normal;font-size:11px;font-weight:700;color:var(--tinte);border:1px solid var(--tinte);border-radius:5px;padding:0 5px;flex:0 0 auto}
.lib-item .m{font-size:12px;color:var(--muted)}
.lib-item .a{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);font-size:13px;padding:18px 4px}

/* ---------- Toast / Overlay ---------- */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--desk);padding:9px 14px;border-radius:9px;font-weight:700;font-size:13.5px;z-index:60;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:inherit;text-decoration:underline;font-weight:700;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(10,14,24,.55);z-index:80;display:grid;place-items:center}
.overlay div{background:var(--card);color:var(--ink);border-radius:12px;padding:18px 22px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- Reiter (eine Ablage je Klasse) ---------- */
.reiter{display:flex;align-items:flex-end;gap:2px;padding-top:6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.reiter::-webkit-scrollbar{display:none}
.rt{display:flex;align-items:center;gap:8px;flex:0 0 auto;border:1px solid transparent;border-bottom:0;background:transparent;margin-bottom:-1px;padding:8px 16px 9px;border-radius:10px 10px 0 0;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.rt i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.rt span{font-size:11px;line-height:1.55;padding:0 6px;border-radius:999px;background:var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.rt:hover{color:var(--ink)}
.rt[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink)}
.rt[aria-selected="true"] span{background:var(--tinte-soft);color:var(--tinte)}

/* ---------- Konto, Hinweise, Dialog ---------- */
.acct{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:10px 0 12px}
.acct b{color:var(--ink)}
.notice{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.drawer-foot{border-top:1px solid var(--line);padding-top:10px;display:flex;gap:6px 18px;flex-wrap:wrap}
.dlg-scrim{z-index:50}
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:51;width:min(420px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-family:var(--f-text);font-size:21px;margin:0}
.dlg>p{margin:0;color:var(--muted);font-size:13.5px}
.dlg form{display:flex;flex-direction:column;gap:12px}
.dlg .err{color:#C2410C;font-size:13px;font-weight:700}
.dlg .err:empty{display:none}
.dlg .ok{background:var(--tinte-soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
.dlg .links{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.btn[disabled]{opacity:.55;cursor:default}

/* ---------- Mobil ---------- */
@media (max-width: 899px){
  .bar{gap:8px 10px}
  .brand{order:1}

<script>
(() => {

/* ================= Grundlagen ================= */
const MMPX = 96 / 25.4;
const AVAIL = 264 * MMPX;          // nutzbare Höhe je Seite (mm → px)

  supa: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4'
};
const FONT_SPECS = ['400 11pt "Atkinson Hyperlegible"','700 11pt "Atkinson Hyperlegible"','italic 400 11pt "Atkinson Hyperlegible"',
  '400 11pt Literata','600 11pt Literata','700 11pt Literata','italic 400 11pt Literata'];
const ACCENTS = {
  tinte:   { name:'Tinte',   c:'#1F4FA0', t:'#E9EEF8' },
  petrol:  { name:'Petrol',  c:'#0D6767', t:'#E3F0EF' },
  wein:    { name:'Weinrot', c:'#8A2A3E', t:'#F5E9EC' },
  graphit: { name:'Graphit', c:'#383C44', t:'#ECEDF0' }
};
/* Reiter: eine Ablage je Klasse. Neue Blätter übernehmen Kurs, Farbe und Anrede der Klasse. */
const KLASSEN = [
  { id: 'gk',   label: 'Grundkurs',   course: 'Grundkurs Deutsch',   accent: 'tinte',  anrede: 'sie' },
  { id: 'k10',  label: 'Klasse 10',   course: 'Deutsch Klasse 10',   accent: 'petrol', anrede: 'du' },
  { id: 'k910', label: 'Klasse 9/10', course: 'Deutsch Klasse 9/10', accent: 'wein',   anrede: 'du' }
];
const KL = id => KLASSEN.find(k => k.id === id) || KLASSEN[0];
/* Online-Ablage über Supabase. Leer = ausgeschaltet: Blätter bleiben im Browser.
   Zum Einschalten Project URL und Publishable key eintragen (Anleitung in README.md). */
const SUPABASE = { url: '', key: '' };
const INFO_KINDS = ['Info','Merke','Tipp','Hinweis','Methode','Definition'];
const TYPES = {
  material: { label:'Material',      desc:'Text mit Zeilennummern' },
  tasks:    { label:'Aufgaben',      desc:'mit Operator-Check' },
  info:     { label:'Infokasten',    desc:'Merke, Tipp, Definition' },
  table:    { label:'Tabelle',       desc:'zum Ausfüllen' },
  lines:    { label:'Schreibfläche', desc:'Linien oder Kästchen' },
  heading:  { label:'Überschrift',   desc:'Zwischentitel' },
  text:     { label:'Absatz',        desc:'Einleitung, Hinweis' },
  quote:    { label:'Zitat',         desc:'Impuls zum Einstieg' },
  image:    { label:'Bild',          desc:'Grafik, Schaubild' },
  pagebreak:{ label:'Seitenumbruch', desc:'Rest auf neue Seite' }
};

/* Operatoren: IQB-Grundstock Deutsch (gemeinsamer Abituraufgabenpool) + gebräuchliche Ergänzungen */
const OPS = [
  { op:'analysieren', afb:[1,3], iqb:1 }, { op:'beschreiben', afb:[1,2], iqb:1 },
  { op:'beurteilen', afb:[2,3], iqb:1 }, { op:'charakterisieren', afb:[2,3], iqb:1 },
  { op:'darstellen', afb:[1,2], iqb:1, verb:'stellen', part:'dar', tpl:'Stellen Sie … dar.' },
  { op:'einordnen', afb:[1,2], iqb:1, verb:'ordnen', part:'ein', tpl:'Ordnen Sie … ein.' },
  { op:'erläutern', afb:[2,3], iqb:1 }, { op:'erörtern', afb:[1,3], iqb:1 },
  { op:'in Beziehung setzen', afb:[2,3], iqb:1, verb:'setzen', part:'beziehung', tpl:'Setzen Sie … in Beziehung.' },
  { op:'interpretieren', afb:[1,3], iqb:1 },
  { op:'sich auseinandersetzen', afb:[2,3], iqb:1, verb:'setzen', part:'auseinander', tpl:'Setzen Sie sich mit … auseinander.' },
  { op:'Stellung nehmen', afb:[2,3], iqb:1, verb:'nehmen', part:'stellung', tpl:'Nehmen Sie Stellung zu …' },
  { op:'überprüfen', afb:[2,3], iqb:1 }, { op:'verfassen', afb:[1,3], iqb:1 },
  { op:'vergleichen', afb:[2,3], iqb:1 },
  { op:'zusammenfassen', afb:[1,2], iqb:1, verb:'fassen', part:'zusammen', tpl:'Fassen Sie … zusammen.' },
  { op:'nennen', afb:[1,1] }, { op:'wiedergeben', afb:[1,1], verb:'geben', part:'wieder', tpl:'Geben Sie … wieder.' },
  { op:'skizzieren', afb:[1,2] }, { op:'erklären', afb:[2,2] },
  { op:'herausarbeiten', afb:[2,2], verb:'arbeiten', part:'heraus', tpl:'Arbeiten Sie … heraus.' },
  { op:'untersuchen', afb:[2,2] }, { op:'belegen', afb:[2,2] }, { op:'begründen', afb:[2,3] },
  { op:'prüfen', afb:[2,3] }, { op:'bewerten', afb:[3,3] }, { op:'deuten', afb:[3,3] },
  { op:'diskutieren', afb:[3,3] }, { op:'entwerfen', afb:[3,3] }, { op:'gestalten', afb:[3,3] }
];
const IRREG = { nehmen: 'nimm', geben: 'gib', entwerfen: 'entwirf' };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
OPS.forEach(o => {
  if (!o.tpl) o.tpl = cap(o.op) + ' Sie …';
  const base = o.verb || o.op;
  o.imp = IRREG[base] || (base.endsWith('ern') ? base.slice(0, -1) + 'e' : base.slice(0, -2) + 'e');
  o.tplDu = cap(o.imp) + o.tpl.replace(/^\S+ Sie/, '').replace(/^ sich /, ' dich ');
});
const ROMAN = ['', 'I', 'II', 'III'];
const afbLabel = r => r[0] === r[1] ? ROMAN[r[0]] : ROMAN[r[0]] + '–' + ROMAN[r[1]];

const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const wait = ms => new Promise(r => setTimeout(r, ms));
const slug = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss')
  .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'Arbeitsblatt';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };

/* ---------- Inline-Auszeichnung: **fett**, *kursiv*, ^1 hochgestellt ---------- */
function inlineTokens(str) {
  const out = []; const re = /\*\*([^*]+)\*\*|\*([^*]+)\*|\^([0-9]+|\*)/g;
  let last = 0, m; str = String(str || '');
  while ((m = re.exec(str))) {
    if (m.index > last) out.push({ t: str.slice(last, m.index) });
    if (m[1] != null) out.push({ t: m[1], b: 1 });
    else if (m[2] != null) out.push({ t: m[2], i: 1 });
    else out.push({ t: m[3], sup: 1 });
    last = re.lastIndex;
  }
  if (last < str.length) out.push({ t: str.slice(last) });
  return out;
}
function tokHTML(k) { let h = esc(k.t); if (k.sup) return '<sup>' + h + '</sup>'; if (k.b) h = '<b>' + h + '</b>'; if (k.i) h = '<i>' + h + '</i>'; return h; }
const inlineHTML = s => inlineTokens(s).map(tokHTML).join('');
// Absätze durch Leerzeile; einfache Umbrüche (z. B. aus PDFs kopiert) werden zu Leerzeichen
const flowParas = t => String(t || '').replace(/\r/g, '').split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, ' ').trim()).filter(Boolean);
// Absätze durch Leerzeile; einfache Umbrüche bleiben Zeilenumbrüche
const lineParas = t => String(t || '').replace(/\r/g, '').split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
const parasHTML = t => lineParas(t).map(p => '<p>' + p.split('\n').map(inlineHTML).join('<br>') + '</p>').join('');
function toWords(text) {
  const words = []; let cur = '';
  for (const k of inlineTokens(text)) {
    if (k.sup) { cur += tokHTML(k); continue; }
    for (const p of k.t.split(/(\s+)/)) {
      if (!p) continue;
      if (/^\s+$/.test(p)) { if (cur) { words.push(cur); cur = ''; } }
      else cur += tokHTML({ ...k, t: p });
    }
  }
  if (cur) words.push(cur);
  return words;
}
function parseNotes(t) {
  return String(t || '').split('\n').map(s => s.trim()).filter(Boolean).map((s, i) => {
    const m = s.match(/^(\d+|\*)[).:]?\s+(.*)$/);
    return m ? { n: m[1], text: m[2] } : { n: String(i + 1), text: s };
  });
}

/* ---------- Operator-Erkennung ---------- */
const DU_LEAD = new Set(['und', 'oder', 'dann', 'danach', 'anschließend', 'abschließend', 'zunächst', 'außerdem', 'schließlich', 'nun', 'bitte']);
function detectOps(text) {
  const found = [];
  const sentences = String(text || '').split(/(?<=[.!?;:])\s+/);
  for (const s of sentences) {
    const w = s.toLowerCase().replace(/[.,;:!?()„“”"«»‚‘’…–—]/g, ' ').split(/\s+/).filter(Boolean);
    for (let i = 0; i < w.length; i++) {
      const sie = w[i + 1] === 'sie';
      const du = !sie && (i === 0 || DU_LEAD.has(w[i - 1]));
      if (!sie && !du) continue;
      for (const o of OPS) {
        const hit = sie
          ? (o.verb ? o.verb === w[i] && w.slice(i + 2).includes(o.part) : o.op === w[i])
          : (o.imp === w[i] && (!o.part || w.slice(i + 1).includes(o.part)));
        if (hit && !found.includes(o)) found.push(o);
      }
    }
  }
  return found;
}
// Setzt einen Operator an den Anfang des ersten Satzes (Sie- oder du-Form); ein Operator dort wird ersetzt.
function applyOperator(text, o, anrede) {
  const tpl = anrede === 'du' ? o.tplDu : o.tpl;
  const cur = String(text || '').trim();
  if (!cur) return tpl;
  const mm = cur.match(/^([^.!?]*[.!?])(\s[\s\S]*)?$/);
  let first = mm ? mm[1] : cur; const rest = mm && mm[2] ? mm[2] : '';

  const w = lead ? lead[1].toLowerCase() : '';

  if (cands.length) {
    first = first.slice(lead[0].length);
    const old = cands.find(x => !x.part || new RegExp('(^|\\s)' + x.part + '(?=$|[\\s,;:.])', 'i').test(first)) || cands[0];
    if (old.part === 'stellung') first = first.replace(/^Stellung(\s+zu)?(?=$|[\s,;:])/i, '');
    else if (old.part === 'auseinander') first = first.replace(/^(sich|dich)\s+mit\s+/i, '').replace(/(^|\s)auseinander(?=$|[\s,;:])/i, '$1');
    else if (old.part === 'beziehung') first = first.replace(/(^|\s)in\s+Beziehung(?=$|[\s,;:])/i, '$1');
    else if (old.part) first = first.replace(new RegExp('(^|\\s)' + old.part + '(?=$|[\\s,;:])', 'i'), '$1');
    first = first.replace(/\s{2,}/g, ' ').trim();
  } else {
    const fw = (first.match(/^\S+/) || [''])[0];
    if (/^(wie|was|ob|warum|weshalb|inwiefern|inwieweit|welche[nmrs]?|wodurch|wozu)$/i.test(fw)) first = ', ' + fw.toLowerCase() + first.slice(fw.length);
    else if (/^(der|die|das|den|dem|des|ein|eine|einen|einem|eines|ihre[nmrs]?|ihr|deine[nmrs]?|dein|mithilfe|anhand|zentrale|wesentliche)$/i.test(fw)) first = fw.toLowerCase() + first.slice(fw.length);
  }
  if (!first) return tpl + rest;
  let out = first.startsWith(',')
    ? tpl.replace(/\s*(zu |mit )?…/, '').replace(/\.$/, '') + first
    : (tpl.includes('…') ? tpl.replace('…', first) : tpl + ' ' + first);

}
const opsRange = ops =>ops.length ? [Math.min(...ops.map(o => o.afb[0])), Math.max(...ops.map(o => o.afb[1]))] : null;

/* ================= Worterklärungen (Glossar) ================= */
/* Jede Erklärung hängt an einem Wort (oder einer Wortgruppe) und seiner Stelle im Text:

    else missing.push(g);

  [...list].sort((a, c) => c.end - a.end || c.no - a.no).forEach(x => { out = out.slice(0, x.end) + '' + x.no + '' + out.slice(x.end); });
  return { text: out, list, missing };
}
// Wörter für das Setzen: HTML mit Fußnotenzahl + reiner Text (für die Klick-Zuordnung)
function toWordsM(text) {
  const words = []; let h = '', t = '', gl = false;
  const push = () => { if (h) words.push({ h, t, gl }); h = ''; t = ''; gl = false; };
  for (const k of inlineTokens(text)) {
    if (k.sup) { h += tokHTML(k); continue; }
    for (const p of k.t.split(/(\s+)/)) {
      if (!p) continue;
      if (/^\s+$/.test(p)) { push(); continue; }
      if (/\d+/.test(p)) gl = true;

  if (Array.isArray(b.glossary)) { delete b.notes; return; }
  const notes = parseNotes(b.notes); const raw = String(b.text || '');

  while ((m = re.exec(raw))) { out += raw.slice(last, m.index) + m[1]; marks.push({ term: m[1], start: out.length - m[1].length, num: m[2] }); last = m.index + m[0].length; }

    const occ = occurrences(out, mk.term); let n = occ.findIndex(o => o.start === mk.start); if (n < 0) n = 0;
    const note = notes.find(x => x.n === mk.num); if (note) used.add(note);

    gloss.push({ term: mk.term, n, text: sp ? sp[1] : (note ? note.text : '') });

  notes.forEach(note => { if (used.has(note)) return; const sp = split(note.text); gloss.push({ term: sp ? sp[0] : '', n: 0, text: sp ? sp[1] : note.text }); });

function measure(it) {
  const r0 = it.el.getBoundingClientRect();
  it.h = r0.height;
  if (!it.atoms || !it.atoms.length) { it.atoms = null; return; }
  const rs = it.atoms.map(a => a.getBoundingClientRect());
  const tops = rs.map(r => r.top - r0.top);
  it.pre = tops[0];
  it.post = Math.max(0, r0.height - (rs[rs.length - 1].bottom - r0.top));
  it.ah = rs.map((r, i) => (i < rs.length - 1 ? tops[i + 1] : r.bottom - r0.top) - tops[i]);
  it.cpre = it.contPre ? it.contPre() : 0;
  if (!it.assemble) it.assemble = (s, e) => { const w = it.el.cloneNode(false); it.atoms.slice(s, e).forEach(a => w.appendChild(a.cloneNode(true))); return w; };
}
const sum = (a, s, e) => { let t = 0; for (let i = s; i < e; i++) t += a[i]; return t; };

function paginate(items) {
  const pages = [{ list: [], used: 0 }];
  const cur = () => pages[pages.length - 1];
  const fresh = () => { pages.push({ list: [], used: 0 }); };
  for (let k = 0; k < items.length; k++) {
    const it = items[k];
    if (it.type === 'pagebreak') { if (cur().list.length) fresh(); continue; }
    if (!it.el) continue;
    let gap = cur().list.length ? GAP : 0;
    if (it.type === 'heading' && cur().list.length) {
      const need = it.h + GAP + minStart(items[k + 1]);
      if (cur().used + gap + need > AVAIL) { fresh(); gap = 0; }
    }
    if (cur().used + gap + it.h <= AVAIL) { cur().list.push({ it, whole: true }); cur().used += gap + it.h; continue; }
    if (!it.atoms) {
      if (cur().list.length) { fresh(); }
      cur().list.push({ it, whole: true }); cur().used += it.h; if (cur().used > AVAIL) cur().over = true; continue;
    }
    const n = it.atoms.length; let s = 0, guard = 0;
    while (s < n && guard++ < 500) {
      gap = cur().list.length ? GAP : 0;
      const room = AVAIL - cur().used - gap;
      const pre = s === 0 ? it.pre : it.cpre;
      let e = s, h = pre + it.post;
      while (e < n && h + it.ah[e] <= room) { h += it.ah[e]; e++; }
      if (e === n) { cur().list.push({ it, s, e }); cur().used += gap + h; break; }
      const needFirst = s === 0 ? Math.min(it.keepFirst, n) : 1;
      if (e - s < needFirst) { if (cur().list.length) { fresh(); continue; } e = Math.max(e, s + 1); }
      if (n - e < it.keepLast) { const e2 = n - it.keepLast; if (e2 - s >= needFirst) e = e2; else if (cur().list.length && s === 0) { fresh(); continue; } }
      const ph = pre + sum(it.ah, s, e) + (e === n ? it.post : 0);
      cur().list.push({ it, s, e }); cur().used += gap + ph;
      if (cur().used > AVAIL + 1) cur().over = true;
      fresh(); s = e;
    }
  }
  if (pages.length > 1 && !cur().list.length) pages.pop();
  return pages;
}

function target(bid) { return bid === 'meta' ? state.sheet.meta : state.sheet.blocks.find(b => b.id === bid); }

}
function onChange(e) {

function onClick(e) {

    }
    case 'up': case 'down': { const j = act === 'up' ? idx - 1 : idx + 1; if (j < 0 || j >= blocks.length) return; [blocks[idx], blocks[j]] = [blocks[j], blocks[idx]]; state.sel = bid; changed(true); return; }
    case 'dup': { const c = clone(b); c.id = 'b' + uid(); blocks.splice(idx + 1, 0, c); state.sel = c.id; changed(true); return; }
    case 'del': { snapshot(); blocks.splice(idx, 1); state.sel = null; changed(true); toast(`${TYPES[b.type].label} gelöscht`, 'Rückgängig', () => { state.sheet = undoSnap; undoSnap = null; changed(true); }); return; }
    case 'add': {
      const nb = newBlock(a.dataset.type);
      const at = state.sel && state.sel !== 'meta' ? blocks.findIndex(x => x.id === state.sel) + 1 : blocks.length;
      blocks.splice(at > 0 ? at : blocks.length, 0, nb); state.sel = nb.id; state.closed.delete(nb.id); changed(true);
      const nc = $(`#editor [data-bid="${nb.id}"]`); if (nc) { nc.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); const f = nc.querySelector('input[type=text],textarea'); if (f) f.focus({ preventScroll: true }); }
      return;
    }
    case 'task-add': b.items.push({ text: '', tag: '' }); changed(true); { const f = $(`#editor [data-bid="${bid}"] [data-k="items.${b.items.length - 1}.text"]`); if (f) f.focus(); } return;
    case 'task-del': { const i = +a.dataset.i; snapshot(); b.items.splice(i, 1); changed(true); toast('Aufgabe entfernt', 'Rückgängig', () => { state.sheet = undoSnap; changed(true); }); return; }
    case 'task-up': { const i = +a.dataset.i; if (i > 0) { [b.items[i - 1], b.items[i]] = [b.items[i], b.items[i - 1]]; changed(true); } return; }
    case 'row-add': b.rows.push(Array(b.cols.length).fill('')); changed(true); return;
    case 'row-del': if (b.rows.length > 1) { b.rows.pop(); changed(true); } return;
    case 'col-add': if (b.cols.length < 6) { b.cols.push(''); b.rows.forEach(r => r.push('')); changed(true); } return;

    case 'fmt': b.fmt = { ...(b.fmt || {}), [a.dataset.f]: a.dataset.v }; changed(true); return;
    case 'fmt-toggle': if (state.fmtOpen.has(bid)) state.fmtOpen.delete(bid); else state.fmtOpen.add(bid); renderEditor(); return;

/* ---------- Bilder ---------- */
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function handleImage(file, b) {
  try {
    const url = URL.createObjectURL(file); const img = await loadImg(url);
    const inDb = backend && backend.kind === 'claude';
    const max = store.assets ? 1600 : (inDb ? 1000 : 1400);
    let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
    b.w = w; b.h = h; b.src = '';
    if (store.assets) {
      try { const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .86)); const up = await store.assets.upload(blob); b.src = up.url; b.assetId = up.id; } catch (err) { b.src = ''; }
    }
    if (!b.src) b.src = c.toDataURL('image/jpeg', inDb ? .72 : .84);
    changed(true);
  } catch { toast('Das Bild ließ sich nicht öffnen. Bitte JPG oder PNG wählen.'); }
}

/* ================= Ablage ================= */
/* Drei Speicherorte mit gleicher Schnittstelle (list, load, save, remove):
   local    – nur dieser Browser (Standard auf GitHub Pages, solange SUPABASE leer ist)
   supabase – Online-Ablage, nach Anmeldung; nur das eigene Konto sieht seine Zeilen
   claude   – Ablage des claude.ai-Kontos, wenn die Seite als Artifact läuft */
const LS = { lib: 'abw.lib', last: 'abw.last', klasse: 'abw.klasse', cur: 'abw.cur', pending: 'abw.pending', skip: 'abw.nologin' };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };
const inClaude = !!(window.claude && typeof window.claude.use === 'function');
function localLib() { return lsGet(LS.lib) || {}; }
function entryOf(sh) { return { id: sh.id, klasse: KL(sh.klasse).id, title: sh.meta.title || 'Ohne Titel', nr: String(sh.meta.nr || ''), updatedAt: sh.updatedAt || 0 }; }

const localB = {
  kind: 'local', key: 'local',
  async list() { return Object.values(localLib()).filter(d => d && d.sheet && d.sheet.meta).map(d => ({ ...entryOf(d.sheet), updatedAt: d.updatedAt || d.sheet.updatedAt || 0 })); },
  async load(id) { const d = localLib()[id]; return d && d.sheet ? clone(d.sheet) : null; },
  async save(sh) { const lib = localLib(); lib[sh.id] = { updatedAt: sh.updatedAt, sheet: sh }; if (!lsSet(LS.lib, lib)) throw { code: 'quota' }; },
  async remove(id) { const lib = localLib(); delete lib[id]; lsSet(LS.lib, lib); }
};
function claudeB(db, id) {
  const col = () => db.collection('data/users/' + id);
  return {
    kind: 'claude', key: 'claude:' + id,
    async list() {
      const snap = await col().get();
      return snap.docs.filter(d => d.exists && d.data() && d.data().sheet).map(d => { const x = d.data(); return { id: d.id, klasse: KL(x.klasse).id, title: x.title || 'Ohne Titel', nr: String(x.nr || ''), updatedAt: x.updatedAt || 0 }; });
    },
    async load(docId) { const d = await col().doc(docId).get(); return d.exists && d.data().sheet ? clone(d.data().sheet) : null; },
    async save(sh) {
      const body = { kind: 'sheet', ...entryOf(sh), sheet: sh };
      if (JSON.stringify(body).length > 250000) throw { code: 'toolarge' };
      try { await col().doc(sh.id).set(body); } catch (e) { throw (e && e.code === 'invalid_argument') ? { code: 'toolarge' } : e; }
    },
    async remove(docId) { await col().doc(docId).delete(); }
  };
}
function supaB(sb, user) {
  const T = () => sb.from('worksheets');
  const chk = r => { if (r.error) throw r.error; return r.data; };
  return {
    kind: 'supabase', key: 'sb:' + user.id,
    async list() {
      const rows = chk(await T().select('id,klasse,title,nr,updated_at').order('updated_at', { ascending: false })) || [];
      return rows.map(r => ({ id: r.id, klasse: KL(r.klasse).id, title: r.title || 'Ohne Titel', nr: r.nr || '', updatedAt: Date.parse(r.updated_at) || 0 }));
    },
    async load(id) { const d = chk(await T().select('data').eq('id', id).maybeSingle()); return d && d.data ? d.data : null; },
    async save(sh) { chk(await T().upsert({ id: sh.id, klasse: KL(sh.klasse).id, title: sh.meta.title || 'Ohne Titel', nr: String(sh.meta.nr || ''), data: sh, updated_at: new Date(sh.updatedAt || Date.now()).toISOString() })); },
    async remove(id) { chk(await T().delete().eq('id', id)); }
  };
}

    try { await b.save(sh); delete p[id]; upsertLib(entryOf(sh)); } catch { break; }
  }

}

/* ---------- Speichern ---------- */

}

// Nimmt den Stand sofort auf und speichert der Reihe nach; so geht beim Wechseln nichts verloren.
function saveNow() {

  if (!backend) { savePending = true; return saveChain; }
  savePending = false;

}

}

/* ---------- Speicherort wählen ---------- */

    store.dl = dl; store.assets = assets;

      store.sb = sb;

function authMsg(err) {

  if (c === 'invalid_credentials' || /invalid login credentials/i.test(m)) return 'E-Mail oder Passwort stimmt nicht.';
  if (c === 'email_not_confirmed' || /email not confirmed/i.test(m)) return 'Bitte bestätigen Sie zuerst Ihre E-Mail-Adresse über den Link in der Bestätigungsmail.';
  if (c === 'user_already_exists' || /already (been )?registered/i.test(m)) return 'Für diese E-Mail gibt es schon ein Konto. Bitte melden Sie sich an.';
  if (c === 'weak_password' || /password should|at least 6/i.test(m)) return 'Das Passwort ist zu kurz oder zu einfach (mindestens 6 Zeichen).';
  if (/rate limit|too many/i.test(m) || /rate_limit/.test(c || '')) return 'Zu viele Versuche. Bitte in ein paar Minuten erneut versuchen.';
  if (c === 'signup_disabled' || /signups? not allowed|signup is disabled/i.test(m)) return 'Neue Konten sind für diese Seite abgeschaltet.';
  if (/failed to fetch|network|load failed/i.test(m)) return 'Keine Verbindung zum Server. Bitte die Internetverbindung prüfen.';
  return 'Das hat nicht geklappt: ' + m;
}

const loaded = {};
function loadScript(src) {
  if (loaded[src]) return loaded[src];
  return loaded[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error('Bibliothek nicht geladen')); }; document.head.appendChild(s); });
}
const fileBase = () => { const m = state.sheet.meta; return (m.nr ? 'AB' + slug(m.nr) + '_' : '') + slug(m.title); };

      if (c === 'rate_limited') { toast('Bitte kurz warten und erneut versuchen'); return; }
      if (c === 'too_large') { toast('Die Datei ist zu groß für dieses Ziel'); return; }
    }
  }
  if (!isFramed || location.protocol === 'file:') {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();

      + `<w:style w:type="paragraph" w:default="1" w:styleId="Standard"><w:name w:val="Normal"/><w:qFormat/></w:style>`
      + `<w:style w:type="paragraph" w:customStyle="1" w:styleId="Materialtext"><w:name w:val="Materialtext"/><w:basedOn w:val="Standard"/><w:qFormat/><w:pPr><w:spacing w:after="0" w:line="300" w:lineRule="auto"/><w:jc w:val="both"/></w:pPr><w:rPr><w:rFonts w:ascii="${SERIF}" w:hAnsi="${SERIF}" w:cs="${SERIF}"/><w:sz w:val="21"/><w:szCs w:val="21"/></w:rPr></w:style>`
      + `<w:style w:type="character" w:styleId="Zeilennummer"><w:name w:val="line number"/><w:basedOn w:val="Absatz-Standardschriftart"/><w:uiPriority w:val="99"/><w:semiHidden/><w:unhideWhenUsed/><w:rPr><w:rFonts w:ascii="${SANS}" w:hAnsi="${SANS}"/><w:color w:val="7A808C"/><w:sz w:val="14"/><w:szCs w:val="14"/></w:rPr></w:style>`
      + `<w:style w:type="character" w:default="1" w:styleId="Absatz-Standardschriftart"><w:name w:val="Default Paragraph Font"/><w:uiPriority w:val="1"/><w:semiHidden/><w:unhideWhenUsed/></w:style>`
      + `<w:style w:type="table" w:default="1" w:styleId="NormaleTabelle"><w:name w:val="Normal Table"/><w:uiPriority w:val="99"/><w:semiHidden/><w:unhideWhenUsed/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style></w:styles>`;
    const settingsXml = `${XH}<w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:defaultTabStop w:val="708"/><w:hyphenationZone w:val="425"/><w:characterSpacingControl w:val="doNotCompress"/><w:compat><w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat></w:settings>`;
    const rels = `${XH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdSettings" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/><Relationship Id="rIdFtr" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>${media.map(x => `<Relationship Id="rIdImg${x.n}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/bild${x.n}.jpeg"/>`).join('')}</Relationships>`;
    const ct = `${XH}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`;
    const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
    const core = `${XH}<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xesc((m.nr ? 'AB ' + m.nr + ' – ' : '') + (m.title || ''))}</dc:title><dc:subject>${xesc(m.topic || '')}</dc:subject><dc:language>de-DE</dc:language><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`;
    const rootRels = `${XH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`;
    const zip = new window.JSZip();
    zip.file('[Content_Types].xml', ct); zip.file('_rels/.rels', rootRels); zip.file('docProps/core.xml', core);
    zip.file('word/document.xml', documentXml); zip.file('word/styles.xml', stylesXml); zip.file('word/settings.xml', settingsXml);
    zip.file('word/footer1.xml', footerXml); zip.file('word/_rels/document.xml.rels', rels);
    media.forEach(x => zip.file(`word/media/bild${x.n}.jpeg`, x.bytes));
    const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    overlay('');
    await deliver(fileBase() + '.docx', blob);
  } catch (err) { console.error(err); overlay(''); toast('Word-Datei konnte nicht erstellt werden. Bitte erneut versuchen.'); }
  finally { overlay(''); busy = false; }
}

/* ================= Ansicht, Drucken ================= */
function setView(v) {
  state.view = v;
  $('#tab-edit').setAttribute('aria-pressed', v === 'edit'); $('#tab-prev').setAttribute('aria-pressed', v === 'preview');
  applyResponsive();
}
function applyResponsive() {
  const narrow = window.matchMedia('(max-width: 899px)').matches;
  $('#editor').hidden = narrow && state.view !== 'edit';
  $('#preview').hidden = narrow && state.view !== 'preview';
  applyScale();
}
function doPrint() {
  const pr = $('#printroot'); pr.innerHTML = '';
  document.querySelectorAll('#pages .page').forEach(p => { const c = p.cloneNode(true); c.style.transform = 'none'; c.style.position = 'relative'; c.querySelectorAll('.is-sel').forEach(n => n.classList.remove('is-sel')); pr.appendChild(c); });
  window.print();
}

/* ================= Start ================= */
function boot() {
  const ed = $('#editor');
  ed.addEventListener('input', onInput); ed.addEventListener('change', onChange); ed.addEventListener('click', onClick);
  $('#lib-root').addEventListener('click', onLibClick);
  $('#lib-root').addEventListener('input', e => { if (e.target.id === 'lib-q') { state.libQuery = e.target.value; renderLib(); } });
  $('#dlg-root').addEventListener('click', onDlgClick);
  $('#dlg-root').addEventListener('submit', onDlgSubmit);
  $('#import-file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });
  $('#reiter').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) switchKlasse(b.dataset.k); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (gl.open) { closeGloss(); return; }
    if (state.dlg) { if (state.dlg.mode === 'login') lsSet(LS.skip, true); closeDlg(); return; }
    if (state.libOpen) { state.libOpen = false; state.confirmDel = null; renderLib(); }
  });
  $('.bar').addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act;
    if (act === 'tab') setView(a.dataset.v);
    if (act === 'lib-open') {
      state.libOpen = true; renderLib(); refreshLib().catch(() => {});
      const q = $('#lib-q'); if (q && !window.matchMedia('(max-width: 899px)').matches) q.focus();
    }
    if (act === 'login') openDlg('login');
    if (act === 'pdf') exportPDF();
    if (act === 'docx') exportDOCX();
    if (act === 'print') doPrint();
  });
  $('#btn-zoom').addEventListener('click', () => { state.zoom = state.zoom === 'fit' ? 'full' : 'fit'; applyScale(); });
  $('#gl-root').addEventListener('submit', onGlossSubmit);
  $('#gl-root').addEventListener('input', e => { if (e.target.id === 'gl-term') updOcc(); });
  $('#gl-root').addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a || !gl.open) return;
    if (a.dataset.act === 'gl-close') closeGloss();
    if (a.dataset.act === 'gl-del') { const o = gl.open; const b = target(o.bid); closeGloss(); if (b && o.idx >= 0) removeGloss(b, o.idx); }
  });
  document.addEventListener('pointerdown', e => { if (gl.open && !e.target.closest('#gpop')) closeGloss(); }, true);
  // Schließt erst, wenn wirklich weggescrollt wurde (kleine Sprünge durch Fokus ignorieren)
  ['#preview-scroll', '#editor'].forEach(q => $(q).addEventListener('scroll', () => {
    const o = gl.open; if (!o || !o.sc || narrowGloss()) return;
    if (Math.abs($('#preview-scroll').scrollTop - o.sc.p) > 60 || Math.abs($('#editor').scrollTop - o.sc.e) > 60) closeGloss();
  }, { passive: true }));
  window.addEventListener('resize', () => { if (gl.open) placeGloss(); });
  const selectQuiet = bid => {
    state.sel = bid; markSel();
    document.querySelectorAll('#editor .card.sel').forEach(c => c.classList.remove('sel'));
    const c = document.querySelector(`#editor .card[data-bid="${bid}"]`); if (c) c.classList.add('sel');
  };
  let skipClick = false;
  // Mehrere Wörter markieren → Worterklärung für die Wortgruppe
  $('#pages').addEventListener('mouseup', () => {
    const sel = window.getSelection(); if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    const r = sel.getRangeAt(0); const sc = r.startContainer;
    const blk = (sc.nodeType === 1 ? sc : sc.parentElement).closest('.blk-mat'); if (!blk) return;
    const bid = blk.dataset.bid;
    const picked = [...document.querySelectorAll(`#pages [data-bid="${bid}"] .mat-body .w`)].filter(w => r.intersectsNode(w));
    if (!picked.length) return;
    const rect = rectOf(r); sel.removeAllRanges();
    skipClick = true; setTimeout(() => { skipClick = false; }, 350);
    selectQuiet(bid); glossFromSpans(bid, picked, rect);
  });
  $('#pages').addEventListener('click', e => {
    if (skipClick) { skipClick = false; return; }
    const w = e.target.closest('.mat-body .w'); const wb = w && w.closest('.blk-mat');
    if (wb) { selectQuiet(wb.dataset.bid); glossFromSpans(wb.dataset.bid, [w], rectOf(w)); return; }
    const n = e.target.closest('[data-bid]'); if (!n) return;
    const bid = n.dataset.bid; state.sel = bid; state.closed.delete(bid);
    if (window.matchMedia('(max-width: 899px)').matches) setView('edit');
    renderEditor(); markSel();
    const c = $(`#editor [data-bid="${bid}"]`); if (c) c.scrollIntoView({ block: 'start', behavior: 'smooth' });
  });
  if (canPrint) $('#btn-print').hidden = false;
  window.matchMedia('(max-width: 899px)').addEventListener('change', applyResponsive);
  try { new ResizeObserver(() => applyScale()).observe($('#preview-scroll')); } catch { window.addEventListener('resize', applyScale); }
  window.addEventListener('online', () => { flushPending().then(() => { if (state.sheet && !savePending) idleStatus(); }); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && savePending) saveNow(); });
  window.addEventListener('pagehide', () => { if (savePending) saveNow(); });

  // Erster Stand: zuletzt geöffnetes Blatt dieses Reiters aus dem Zwischenspeicher, sonst Entwurf
  const k = lsGet(LS.klasse); state.klasse = KLASSEN.some(x => x.id === k) ? k : 'gk';
  const cached = lsGet(LS.cur);
  const ok = cached && cached.sheet && cached.sheet.meta && Array.isArray(cached.sheet.blocks) && KL(cached.sheet.klasse).id === state.klasse;
  state.sheet = normalizeSheet(ok ? cached.sheet : draftFor(state.klasse));
  renderTabs(); renderEditor(); applyResponsive(); renderPreview(); setStatus('pending');
  Promise.race([Promise.all(FONT_SPECS.map(f => document.fonts.load(f))), wait(3500)]).then(() => { fontsOK = true; renderPreview(); }).catch(() => {});
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => scheduleRender(60));
  initBackend().catch(err => { console.error(err); useBackend(localB); });
}
boot();

})();
</script>
