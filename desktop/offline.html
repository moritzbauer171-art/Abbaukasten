<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>LehrWerk – keine Verbindung</title>
<style>
:root{color-scheme:light dark}
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;font:16px/1.5 "Segoe UI",system-ui,sans-serif;background:#EEF0F4;color:#1C1F27}
@media (prefers-color-scheme:dark){body{background:#16181D;color:#E9EBF0}.c{background:#22252C!important}}
.c{background:#fff;border-radius:18px;padding:34px 38px;max-width:460px;box-shadow:0 10px 40px rgba(15,25,45,.15);text-align:center}
svg{width:64px;height:64px}
h1{font-size:22px;margin:14px 0 6px}
p{margin:0 0 20px;color:#5B6271}
button{font:700 15px "Segoe UI",system-ui,sans-serif;border:0;border-radius:999px;background:#2741B5;color:#fff;padding:10px 22px;cursor:pointer}
small{display:block;margin-top:14px;color:#8A90A0}
</style></head><body><div class="c">
<svg viewBox="2.5 2.5 19 19"><rect x="2.5" y="2.5" width="19" height="19" rx="5" fill="#2741B5"/><path d="M7.2 16.8 13.9 10.1M13.9 10.1l2.6-2.6a1.3 1.3 0 0 1 1.8 0a1.3 1.3 0 0 1 0 1.8l-2.6 2.6M7.2 16.8l-.6 1.9 1.9-.6" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="17.6" cy="6.4" r="1.6" fill="#F5B400"/></svg>
<h1>Keine Internetverbindung</h1>
<p>LehrWerk braucht beim ersten Start Internet, um dich anzumelden. Danach funktioniert die App auch offline mit den zuletzt geöffneten Stunden.</p>
<button id="r" type="button">Erneut versuchen</button>
<small>Es wird automatisch neu versucht, sobald du wieder online bist.</small>
</div>
<script>
const go = () => { location.href = 'https://moritzbauer171-art.github.io/Abbaukasten/'; };
document.getElementById('r').onclick = go; addEventListener('online', go);
</script></body></html>
