# Prüft bei jedem Hochladen: Ist index.html aus src/ gebaut, und laufen die Tests durch?
name: Tests
on:
  push:
    paths: ['src/**', 'tests/**', 'tools/**', 'index.html', '.github/workflows/tests.yml']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Werkzeuge
        run: |
          pip install pytest==8.3.3 playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Zusammenbauen
        run: python tools/build.py --check && python tools/build.py
      - name: Tests
        run: python -m pytest -q
      - name: Bilder bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: test-ausgabe, path: tests/_out }
