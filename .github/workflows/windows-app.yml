# Baut die Windows-App bei Änderungen am Desktop-Ordner (oder von Hand über „Run workflow“)
# und legt sie als Download unter Releases ab (immer gleicher Link, siehe README).
# Änderungen nur an der Website (index.html) lösen vorerst keinen neuen App-Build aus.
name: Windows-App

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows-app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Bauen
        working-directory: desktop
        run: |
          export AB_VERSION="$(python3 -c "import json;print(json.load(open('package.json'))['version'].rsplit('.',1)[0])").${{ github.run_number }}"
          echo "AB_VERSION=$AB_VERSION" >> "$GITHUB_ENV"
          python3 build_desktop.py
      - name: Als Release ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Windows 10 und 11, 64 Bit, ohne Installation. ZIP entpacken (Ordner zusammenlassen) und LehrWerk.exe doppelklicken. Meldet Windows „Der Computer wurde durch Windows geschützt“: „Weitere Informationen“ → „Trotzdem ausführen“. Die App lädt immer die aktuelle Online-Version; neue Funktionen kommen ohne neuen Download. Version $AB_VERSION, Stand ${GITHUB_SHA::7}."
          git tag -f windows && git push -f origin windows
          # Jede Version unter eigenem Namen ablegen: Ersetzen bestehender Dateien scheitert bei GitHub zeitweise mit Fehler 500
          F="LehrWerk-Windows-$AB_VERSION.zip"
          cp desktop/out/LehrWerk-Windows-x64.zip "desktop/out/$F"
          cp desktop/out/LehrWerk-Windows-x64.zip desktop/out/LehrWerk-Windows.zip
          if gh release view windows >/dev/null 2>&1; then
            gh release upload windows "desktop/out/$F"
            gh release edit windows --title "LehrWerk für Windows ($AB_VERSION)" --notes "$NOTES" --latest
          else
            gh release create windows "desktop/out/$F" --title "LehrWerk für Windows ($AB_VERSION)" --notes "$NOTES" --latest
          fi
          # feste Namen für den Download-Link und für ältere App-Versionen (3.1 sucht ...-x64.zip) – darf scheitern
          gh release upload windows desktop/out/LehrWerk-Windows.zip --clobber || echo "::warning::LehrWerk-Windows.zip nicht ersetzt"
          gh release upload windows desktop/out/LehrWerk-Windows-x64.zip --clobber || echo "::warning::LehrWerk-Windows-x64.zip nicht ersetzt"
          # ältere versionierte Dateien aufräumen
          for a in $(gh release view windows --json assets -q '.assets[].name' | grep -E '^LehrWerk-Windows-[0-9]+\.[0-9]+\.[0-9]+\.zip$' | grep -vx "$F"); do gh release delete-asset windows "$a" -y || true; done
